name: Add missing satellite picons without overwriting existing PNGs
on:
  push:
    branches: [picons/satellite-fill-20261022]
    paths: [.github/workflows/fill-satellite-packages.yml, tools/fill-satellite-packages.py, tools/data/satellite-additive-fill-plan.json.gz]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/picons/satellite-fill-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /update.json
            /update-test.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: 2d5b1ec8d37742825bb5571508c856d919590377
          path: .approved-picons
          sparse-checkout: docs
      - name: Add missing PNGs and prove every current PNG is unchanged
        run: |
          python3 -u tools/fill-satellite-packages.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/satellite-additive-fill-20261022.json
          git commit -m 'Add missing satellite PNGs; preserve every existing picon and IPK 1.0.13'
          git push origin HEAD:refs/heads/picons/satellite-fill-20261022
      - uses: actions/upload-artifact@v4
        with:
          name: satellite-additive-fill-verification
          path: reports/satellite-additive-fill-20261022.json
