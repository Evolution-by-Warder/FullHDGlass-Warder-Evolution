name: Prepare supplied community spinner folders
on:
  push:
    branches: [feature/spinner-preview-library-20261031]
    paths:
      - .github/workflows/community-spinner-preview-library.yml
      - tools/import-community-spinner-previews.py
      - assets/warder/downloads/ui/spinners/sources/community/**
permissions:
  contents: write
jobs:
  community-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            assets/warder/downloads/ui/spinners/sources/community
            assets/warder/downloads/ui/spinners/preview-library
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only archive and preview dependencies
        run: |
          python -m pip install --quiet Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libarchive-tools ffmpeg
      - name: Import PNG sequences into separate preview directories
        run: python tools/import-community-spinner-previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: Warder-154-separate-spinner-previews
          path: assets/warder/downloads/ui/spinners/preview-library/
          retention-days: 30
      - name: Save original-source manifest and preview assets on this branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse assets/warder/downloads/ui/spinners/preview-library assets/warder/downloads/ui/spinners/sources/community/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Add 142 separately attributed community spinner folders and one-at-a-time gallery"
          git push origin HEAD:feature/spinner-preview-library-20261031
