name: Verify complete FullHDGlass integration 2026-11-22
on:
  push:
    branches:
      - integration/fullhdglass-all-approved-radio-20261122
  pull_request:
    paths:
      - '.github/workflows/verify-fullhdglass-integrated-20261122.yml'
      - 'source/**'
      - 'tools/test*'
      - 'assets/warder/downloads/picons/channels/manifest.json'
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /design/
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/ui/spinners/
            /assets/warder/runtime-network-dependencies.json
            /assets/warder/channel-picon-build.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure current-main satellite manifest preserved
        run: |
          set -euo pipefail
          test "$(git hash-object assets/warder/downloads/picons/channels/manifest.json)" = "7a7c6b4b96d9b8dc2da60a29c85ae1bd2069b715"
          test "$(git hash-object assets/warder/downloads/picons/channels/SHA256SUMS)" = "e94b5342b8d3d82371ccfbc5898e397d7819a3bb"
          VERSION="$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          case "$VERSION" in 1.0.80|1.0.82|1.0.83|1.0.84|1.0.85|1.0.86|1.0.87) ;; *) echo "Unexpected integration/release version: $VERSION"; exit 1 ;; esac
          grep -qx "Version: $VERSION-1" source/control/control
          echo "Existing main SAT assets unchanged; release version unchanged"
      - name: Diagnose historical layout checksum drift without modifying graphics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,hashlib,json,xml.etree.ElementTree as ET
          s=importlib.util.spec_from_file_location('style','tools/style-setup-screens.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          baseline=json.loads(m.FIXTURE.read_text())
          layouts=m.extract(m.PLUGIN.read_text())
          for name,(source,actual) in layouts.items():
              close='</screen>' if name=='selectIconsDisplayed' else ''
              original=ET.fromstring(baseline['skins'][name]+close)
              now=ET.fromstring(actual+close)
              expected=set(m.widget_ids(original))
              observed=set(m.widget_ids(now))
              print('LAYOUT',name,'SHA256',hashlib.sha256(actual.encode()).hexdigest(),
                    'missing_ids',repr(sorted(expected-observed)),
                    'extra_ids',repr(sorted(observed-expected)),
                    'reproducible',actual.strip()==m.themed(name,baseline['skins'][name]).strip())
          art=json.loads(Path('design/settings-header-asset.json').read_text())
          raw=(Path('source/package-root')/art['path']).read_bytes()
          print('CURRENT MAIN BANNER',art['path'],
                'sha256',hashlib.sha256(raw).hexdigest(),
                'historical_pin',art['sha256'],
                'width_height',int.from_bytes(raw[16:20],'big'),int.from_bytes(raw[20:24],'big'))
          PY
      - name: Receiver-friendly source syntax and packaging hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast
          files=list(Path('source/package-root').rglob('*.py'))
          for f in files:
              ast.parse(f.read_text(encoding='utf8'), filename=str(f), feature_version=(3,9))
          assert len(files)>100
          print("Enigma2 Py3.9 syntax: PASS",len(files))
          PY
          for s in preinst postinst prerm postrm; do sh -n "source/control/$s"; done
      - name: Validate complete approved skin repairs and radio modes
        run: |
          set -euo pipefail
          for t in \
            test-channel-picon-settings.py \
            test-warder-channel-worker.py \
            test_warder_storage_safety.py \
            test_iptv_infobar_service_name.py \
            test_warder_menu_icon_bindings.py \
            test_warder_mainmenu_toggle.py \
            test_warder_integrated_skin.py \
            test_warder_primetime_placements.py \
            test_warder_spinner_order.py \
            test_warder_storage_safety.py \
            test_fastscan_epg_name_geometry.py \
            test_fastscan_epg_owner_sync.py \
            test_fastscan_epg_invisible_rows.py \
            test_fastscan_epg_repaint_cache.py \
            test_unified_radio_saver.py \
            test-radio-live.py \
            test-radio-country-close-list145.py \
            test-radio-hidden-list-refresh147.py \
            test-radio-world.py \
            test-radio-country-logo-cleanup.py; do
            echo "RUN $t"
            python3 -B "tools/$t" -q
          done
          echo "FullHDGlass integrated receiver-independent checks: PASS"
