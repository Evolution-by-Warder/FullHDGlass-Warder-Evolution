name: Verify complete FullHDGlass integration 2026-11-22
on:
  push:
    branches:
      - integration/fullhdglass-all-approved-radio-20261122
  pull_request:
    paths:
      - '.github/workflows/verify-fullhdglass-integrated-20261122.yml'
      - 'source/**'
      - 'tools/test*'
      - 'assets/warder/downloads/picons/channels/manifest.json'
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /design/
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/ui/spinners/
            /assets/warder/runtime-network-dependencies.json
            /assets/warder/channel-picon-build.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure current-main satellite manifest preserved
        run: |
          set -euo pipefail
          test "$(git hash-object assets/warder/downloads/picons/channels/manifest.json)" = "7a7c6b4b96d9b8dc2da60a29c85ae1bd2069b715"
          test "$(git hash-object assets/warder/downloads/picons/channels/SHA256SUMS)" = "e94b5342b8d3d82371ccfbc5898e397d7819a3bb"
          test "$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)" = "1.0.80"
          echo "Existing main SAT assets unchanged; release version unchanged"
      - name: Receiver-friendly source syntax and packaging hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast
          files=list(Path('source/package-root').rglob('*.py'))
          for f in files:
              ast.parse(f.read_text(encoding='utf8'), filename=str(f), feature_version=(3,9))
          assert len(files)>100
          print("Enigma2 Py3.9 syntax: PASS",len(files))
          PY
          for s in preinst postinst prerm postrm; do sh -n "source/control/$s"; done
      - name: Validate complete approved skin repairs and radio modes
        run: |
          set -euo pipefail
          for t in \
            test-channel-picon-settings.py \
            test_warder_primetime_placements.py \
            test_warder_spinner_order.py \
            test_warder_storage_safety.py \
            test_fastscan_epg_name_geometry.py \
            test_fastscan_epg_owner_sync.py \
            test_fastscan_epg_invisible_rows.py \
            test_fastscan_epg_repaint_cache.py \
            test_unified_radio_saver.py \
            test-radio-live.py \
            test-radio-country-close-list145.py \
            test-radio-hidden-list-refresh147.py \
            test-radio-world.py \
            test-radio-country-logo-cleanup.py; do
            echo "RUN $t"
            python3 -B "tools/$t" -q
          done
          echo "FullHDGlass integrated receiver-independent checks: PASS"
