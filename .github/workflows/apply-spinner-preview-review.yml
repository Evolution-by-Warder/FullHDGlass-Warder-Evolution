name: Remove owner-selected spinner duplicates
on:
  push:
    branches: [review/spinner-library-20261031]
    paths:
      - .github/workflows/apply-spinner-preview-review.yml
      - tools/apply-spinner-preview-review.py
      - design/spinner-choice/preview-review-policy.json
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            design/spinner-choice
            assets/warder/downloads/ui/spinners/preview-library
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==11.3.0
      - run: python tools/apply-spinner-preview-review.py
      - name: Save cleaned preview folders and ZIPs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -A assets/warder/downloads/ui/spinners/preview-library
          git diff --cached --quiet && exit 0
          git commit -m "Remove previews 9 and 146 while preserving original source archives"
          git push origin HEAD:review/spinner-library-20261031
