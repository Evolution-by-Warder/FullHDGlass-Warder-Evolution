name: Warder Radio world ZIP - offline security tests

on:
  push:
    branches: [feature/radio-live-world-bundle-installer-20261119]
    paths:
      - tools/test-radio-world.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderRadioWorld.py
      - .github/workflows/radio-world-bundle-offline.yml
  pull_request:
    paths:
      - tools/test-radio-world.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderRadioWorld.py
      - .github/workflows/radio-world-bundle-offline.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/
            tools/test-radio-world.py
            tools/test-radio-packages.py
          sparse-checkout-cone-mode: false
      - name: Python syntax
        run: python3 -m py_compile tools/test-radio-world.py source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderRadioWorld.py
      - name: Existing country package safety
        run: python3 -B tools/test-radio-packages.py
      - name: World archive protection, local country switching and non-radio picon safety
        run: python3 -B tools/test-radio-world.py
