name: Publish approved Warder big menu icons
on:
  push:
    paths:
      - 'assets/warder/menu-icon-overrides/*.png'
      - 'tools/publish-approved-menu-icons.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-approved-menu-icons-sparse
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            tools/publish-approved-menu-icons.py
            assets/warder/downloads.json
            assets/warder/menu-icon-overrides
            assets/warder/downloads/ui/menu-icons-big/menuIconsBig.zip.parts/FINAL-WARDER-AUDITED-20261117
          sparse-checkout-cone-mode: false
      - name: Build and validate production menuIconsBig
        run: python3 tools/publish-approved-menu-icons.py
      - name: Commit updated production archive and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads/ui/menu-icons-big/menuIconsBig.zip.parts/FINAL-WARDER-AUDITED-20261117 assets/warder/downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish owner-approved Warder big menu icons in production archive"
            git push
          fi
