name: Validate FullHDGlass skin translations

on:
  push:
    branches:
      - fix/skin-i18n-21-languages-20261117
    paths:
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/locale/**'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderLocale.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/txt.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/weather.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/E_weather.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/Netatmo.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderUiText.py'
      - 'docs/SKIN-I18N-AUDIT-20261117.md'
      - 'tools/test-warder-skin-i18n.py'
      - 'tools/test-warder-catalog-integrity.py'
      - 'tools/test-warder-locale-on-demand.py'
      - 'tools/test-channel-picon-settings.py'
      - 'tools/test_warder_storage_safety.py'
      - 'tools/test-history-radio-header.py'
      - 'tools/test-dab-artwork-layout.py'
      - 'tools/test-spinner-choice.py'
      - 'tools/build-release-ipk.py'
      - 'source/control/preinst'
      - 'source/control/postinst'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderLocaleDownload.py'
      - '.github/workflows/verify-skin-i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locale-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/SKIN-I18N-AUDIT-20261117.md
            /source/control/
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/
            /source/package-root/usr/lib/enigma2/python/Components/Renderer/
            /source/package-root/usr/share/fonts/prive7.ttf
            /source/package-root/usr/share/enigma2/hd_glass17/skin.xml
            /tools/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Compile Python 3 sources
        run: |
          python -m py_compile source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/{warderLocale,warderLocaleDownload,plugin,txt,weather,E_weather,Netatmo,warderUiText}.py
      - name: Run language regression tests
        run: |
          python tools/test-warder-skin-i18n.py
          python tools/test-warder-catalog-integrity.py
          python tools/test-warder-locale-on-demand.py
          python tools/test_warder_storage_safety.py StorageSafetyTests.test_storage_warning_translated_into_all_21_skin_languages
          python tools/test-channel-picon-settings.py SettingsTests.test_all_supported_languages_have_the_new_menu_text
          python tools/test-spinner-choice.py AssetTests.test_exact_owner_labels_and_twenty_locales
          python tools/test-history-radio-header.py RadioTitleTests.test_active_osd_language_changes_the_caption_without_cached_language RadioTitleTests.test_every_supported_language_has_a_translation_that_fits_the_header
          python tools/test-dab-artwork-layout.py DabArtworkTests.test_active_language_changes_only_the_native_caption_not_the_bitmap DabArtworkTests.test_all_translated_information_captions_fit_the_default_image
          sh -n source/control/preinst
          sh -n source/control/postinst
