name: Probe HDGlass upstream package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hdglass-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public mirror
        run: |
          set -euo pipefail
          BASE='http://dreambox4u.com/emilnabil237/skins/skin-fullhdglass17'
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 "$BASE/installer.sh" -o /tmp/installer.sh
          curl -L --retry 2 --connect-timeout 15 --max-time 60 "$BASE/" -o /tmp/index.html || true
          echo 'installer-bytes:' $(wc -c </tmp/installer.sh)
          echo 'index-bytes:' $(wc -c </tmp/index.html 2>/dev/null || echo 0)
          echo '--- package lines ---'
          grep -Ei 'wget|curl|\.ipk|\.deb|\.zip|package|version|fullhdglass' /tmp/installer.sh || true
          echo '--- mirror links ---'
          grep -Eo 'href=["'"'][^"'"']+["'"']' /tmp/index.html 2>/dev/null | head -100 || true
          echo '--- candidate optional asset paths ---'
          for p in hdg17 piconProv-b piconSat-b piconCam-b piconWeather-b; do
            code=$(curl -L -s -o /tmp/probe -w '%{http_code}' --max-time 20 "$BASE/$p/" || true)
            echo "$p HTTP $code bytes $(wc -c </tmp/probe 2>/dev/null || echo 0)"
          done
