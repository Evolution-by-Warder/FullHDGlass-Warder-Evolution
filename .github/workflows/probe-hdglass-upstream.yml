name: Probe HDGlass upstream package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hdglass-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public installer and discover package URL
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 \
            'http://dreambox4u.com/emilnabil237/skins/skin-fullhdglass17/installer.sh' \
            -o /tmp/installer.sh
          echo 'installer-bytes:' $(wc -c </tmp/installer.sh)
          echo '--- package-related installer lines ---'
          grep -Ei 'wget|curl|\.ipk|\.deb|\.zip|package|version|fullhdglass' /tmp/installer.sh || true
          echo '--- discovered URL-like tokens ---'
          python3 - <<'PY'
          import re
          text=open('/tmp/installer.sh','r',errors='ignore').read()
          for token in re.findall(r'[^\s\"\x27]+', text):
              low=token.lower()
              if 'fullhdglass' in low or '.ipk' in low or '.deb' in low or '.zip' in low:
                  print(token)
          PY
