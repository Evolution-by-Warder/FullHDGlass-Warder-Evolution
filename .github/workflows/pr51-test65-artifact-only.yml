name: PR51 TEST65 receiver candidate IPK (artifact only)

on:
  push:
    branches:
      - work/channelselection-primetime-overlap-20261107
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr51-test65-artifact-only.yml'
      - 'source/package-root/usr/lib/enigma2/python/Components/Renderer/WarderChannelEpgClip.py'
      - 'tools/test_warder_channel_epg_clip.py'

permissions:
  contents: read

jobs:
  build-isolated-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 10
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/package-root/
            /source/control/
            /tools/build-release-ipk.py
            /tools/stage-pr51-clip-candidate.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure candidate is based only on reviewed PR #51 commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "aa48fc48ce83cf5e56e6a6a85eb04cd83440585d" HEAD
          test "$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)" = "1.0.69"
          grep -Fx "Package: enigma2-plugin-skins-fullhdglass-warder-evolution" source/control/control
          grep -Fx "Version: 1.0.69-1" source/control/control
      - name: Build uniquely marked TEST candidate without modifying Git branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import hashlib
          import importlib.util
          import io
          from pathlib import Path
          import shutil
          import runpy
          import subprocess
          import tempfile
          import tarfile

          root = Path.cwd()
          source = root / "source"
          version = "1.0.69-test65"
          package = "enigma2-plugin-skins-fullhdglass-warder-evolution"
          outdir = root / "pr51-candidate"
          outdir.mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory() as tmp:
              tmp = Path(tmp)
              payload = tmp / "payload"
              control = tmp / "control"
              shutil.copytree(source / "package-root", payload, symlinks=True)
              shutil.copytree(source / "control", control, symlinks=True)
              stage = runpy.run_path(str(root / "tools/stage-pr51-clip-candidate.py"))["stage_skin"]
              stage(payload / "usr/share/enigma2/hd_glass17/skin.xml", progress_width=90, marker=False)
              # Staged-only diagnostic log name; do not alter PR or production files.
              clip_file = payload / "usr/lib/enigma2/python/Components/Renderer/WarderChannelEpgClip.py"
              clip_code = clip_file.read_text(encoding="utf-8")
              assert "warder-epg-clip-test59.log" in clip_code
              clip_file.write_text(clip_code.replace("warder-epg-clip-test59.log",
                                                     "warder-epg-clip-test65.log"), encoding="utf-8")
              version_file = payload / "usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version"
              version_file.write_text(version + "\n", encoding="utf-8")
              control_file = control / "control"
              metadata = control_file.read_text(encoding="utf-8")
              assert metadata.count("Version: 1.0.69-1\n") == 1
              metadata = metadata.replace("Version: 1.0.69-1\n", "Version: " + version + "-1\n", 1)
              control_file.write_text(metadata, encoding="utf-8")
              # Visible origin marker in the candidate payload, never written to main.
              marker = payload / "usr/share/enigma2/hd_glass17/PR51-TEST-CANDIDATE.txt"
              marker.write_text("PR51 EXPERIMENTAL TEST65. Source commit: aa48fc48ce83cf5e56e6a6a85eb04cd83440585d\nNo automatic feed publication.\n", encoding="utf-8")
              spec = importlib.util.spec_from_file_location("warder_release_builder", root / "tools/build-release-ipk.py")
              builder = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(builder)
              build = tmp / "build"
              build.mkdir()
              (build / "debian-binary").write_bytes(b"2.0\n")
              builder.archive(control, build / "control.tar.gz")
              builder.archive(payload, build / "data.tar.gz", payload=True)
              target = outdir / (package + "_" + version + "_all.ipk")
              subprocess.run(["ar", "rcsD", str(target), "debian-binary", "control.tar.gz", "data.tar.gz"], cwd=build, check=True)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              target.with_suffix(".ipk.sha256").write_text(digest + "  " + target.name + "\n", encoding="utf-8")
              entries = subprocess.check_output(["ar", "t", str(target)], text=True).splitlines()
              assert entries == ["debian-binary", "control.tar.gz", "data.tar.gz"], entries
              with tarfile.open(build / "control.tar.gz", "r:gz") as tar:
                  metadata = tar.extractfile("./control").read().decode("utf-8")
                  assert "Version: " + version + "-1\n" in metadata
                  assert "Package: " + package + "\n" in metadata
              with tarfile.open(build / "data.tar.gz", "r:gz") as tar:
                  names = tar.getnames()
                  assert "./usr/share/enigma2/hd_glass17/PR51-TEST-CANDIDATE.txt" in names
                  assert "./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPrimeTime.py" in names
                  assert "./usr/lib/enigma2/python/Components/Renderer/WarderPrimeTime.py" in names
                  assert "./usr/lib/enigma2/python/Components/Converter/WarderPrimeTimeGate.py" in names
                  assert "./usr/share/enigma2/hd_glass17/skin.xml" in names
                  assert "./usr/lib/enigma2/python/Components/Renderer/WarderChannelEpgClip.py" in names
                  clip_code = tar.extractfile("./usr/lib/enigma2/python/Components/Renderer/WarderChannelEpgClip.py").read().decode("utf-8")
                  assert 'self._quiet_font = gFont("Regular", 1)' in clip_code
                  assert 'scroll_title_window(title, remaining, measure, position)' in clip_code
                  assert 'index == selected else 0' in clip_code
                  assert 'self._scroll_selected = selected' in clip_code
                  assert 'self._timer.start(55, True)' in clip_code
                  assert 'return suffix[:lo]' in clip_code
                  assert 'setElementFont(component.l.celServiceInfo, self._quiet_font)' in clip_code
                  assert "self.instance.flush()" not in clip_code
                  assert "instance.setSize(eSize(width, height))" in clip_code
                  assert "self.instance.fillRect(eRect(x, y + 2, mask_width, h - 4)" in clip_code
                  assert "self._draw_progress(bar_left" in clip_code
                  assert 'warder-epg-clip-test65.log' in clip_code
                  assert 'warderProgressWidth' in clip_code
                  assert 'warderTestMarker' in clip_code
                  assert 'apply_skin_flags' in clip_code
                  assert 'canvas_test_marker_drawn' in clip_code
                  assert 'native_rows_ready' in clip_code
                  assert 'native_font_suppress_error' in clip_code
                  skin_text = tar.extractfile("./usr/share/enigma2/hd_glass17/skin.xml").read().decode("utf-8")
                  assert skin_text.count('render="WarderChannelEpgClip"') == 1
                  assert 'warderWholeLineScroll="1"' in skin_text
                  assert 'warderProgressWidth="90"' in skin_text
                  assert 'alphaTest="blend"' in skin_text
                  assert 'render="WarderChannelEpgClip"' in skin_text
                  assert "./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py" in names
                  plugin_code = tar.extractfile("./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py").read().decode("utf-8")
                  assert "and line.rstrip().endswith('/>')" in plugin_code
                  assert 'warderProgressWidth="90"' in plugin_code
                  assert 'alphaTest="blend"' in plugin_code
                  assert 'warderTestMarker="1"' not in skin_text
                  assert 'position="1000,102" size="44,12"' not in skin_text
                  runtime = tar.extractfile("./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version").read().decode().strip()
                  assert runtime == version
              print("ISOLATED CANDIDATE SUCCESS", target.name, digest, flush=True)
          PY
      - name: Upload artifact for manual receiver QA only
        uses: actions/upload-artifact@v4
        with:
          name: pr51-TEST65-ONLY-aa48fc48
          path: |
            pr51-candidate/*.ipk
            pr51-candidate/*.sha256
          if-no-files-found: error
          retention-days: 14
