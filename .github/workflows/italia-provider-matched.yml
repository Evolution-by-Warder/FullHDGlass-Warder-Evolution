name: Build visually matched provider missing variants
on:
  push:
    branches: [work/italia-provider-matched-20261124]
    paths: ['.github/workflows/italia-provider-matched.yml']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-provider-matched-20261124/*
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
      - uses: actions/download-artifact@v4
        with:
          name: italian-external-provider-review
          run-id: 45438569616
          github-token: ${{ github.token }}
          path: external-review
      - run: python3 reports/italia-provider-matched-20261124/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers reports/italia-provider-matched-20261124/build.json
          git commit -m "Build ten missing variants for eight visually matched provider names"
          git push origin HEAD:work/italia-provider-matched-20261124
