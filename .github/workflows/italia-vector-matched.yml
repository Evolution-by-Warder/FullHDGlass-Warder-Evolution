name: Build nine verified vector and approved alias variants
on:
  push:
    branches: [work/italia-vector-matched-20261124]
    paths: ['.github/workflows/italia-vector-matched.yml']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-vector-matched-20261124/*
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
      - uses: actions/download-artifact@v4
        with:
          name: italian-vector-provider-review
          run-id: 45442517444
          github-token: ${{ github.token }}
          path: vector-review
      - run: python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5
      - run: python reports/italia-vector-matched-20261124/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers reports/italia-vector-matched-20261124/build.json
          git commit -m "Build nine verified missing provider PNGs"
          git push origin HEAD:work/italia-vector-matched-20261124
