name: Verify plugin install/remove text fit
on:
  pull_request:
    paths:
      - 'source/package-root/usr/share/enigma2/hd_glass17/skin.xml'
      - 'tools/test_plugin_download_font_fit.py'
      - '.github/workflows/verify-plugin-download-text-fit.yml'
  workflow_dispatch:
jobs:
  plugin-download-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plugin download layout
        run: python -m unittest discover -s tools -p 'test_plugin_download_font_fit.py' -v
