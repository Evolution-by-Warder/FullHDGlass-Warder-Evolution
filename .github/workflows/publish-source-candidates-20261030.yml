name: Publish audited picon candidates 30 October
on:
  push:
    branches: [release/source-candidates-20261030]
    paths:
      - .github/workflows/publish-source-candidates-20261030.yml
      - tools/publish-source-candidates-20261030.py
      - tools/test-source-candidates-20261030.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: warder-source-candidates-20261030
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/release/source-candidates-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APPROVED_PICON_REF: 508183459375a32d5bfce59930c1e082a8654eae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/publish-source-candidates-20261030.py
            /tools/test-source-candidates-20261030.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /reports/source-candidates-publication-20261030.json
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: ${{ env.APPROVED_PICON_REF }}
          path: .approved-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugin/artwork/provenance/source-candidates-20261030/
            /plugin/src/Plugins/Extensions/WarderPiconHub/warder_skin_sync.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Test alias scope, exact PNG preservation and deterministic resizing
        run: python tools/test-source-candidates-20261030.py -v
      - name: Build verified archives and exercise actual receiver installer
        shell: bash
        run: |
          set -euo pipefail
          if test -f reports/source-candidates-publication-20261030.json; then
            python -u tools/publish-source-candidates-20261030.py --reuse-candidate --source-ref "$APPROVED_PICON_REF"
          else
            python -u tools/publish-source-candidates-20261030.py --source-root .approved-source --source-ref "$APPROVED_PICON_REF"
          fi
      - name: Validate the shared catalogue with the installed PiconHub planner
        run: |
          python - <<'PYICON'
          import importlib.util,json
          from pathlib import Path
          path=Path('.approved-source/plugin/src/Plugins/Extensions/WarderPiconHub/warder_skin_sync.py')
          spec=importlib.util.spec_from_file_location('piconhub_sync',path)
          sync=importlib.util.module_from_spec(spec);spec.loader.exec_module(sync)
          document=json.loads(Path('assets/warder/downloads/picons/channels/manifest.json').read_text())
          assert not sync.validate_publication_manifest(document,sync.RUNTIME_MANIFEST_URL)
          report=json.loads(Path('reports/source-candidates-publication-20261030.json').read_text())
          count=0
          for entry in report['packages']:
              binding=sync.task_binding_for_package_selector(entry['selector_id'])
              prefs=sync.set_task_position_bindings(sync.default_preferences(),[binding])
              prefs.update(resolution=entry['resolution'],style=entry['style'],update_mode=sync.UPDATE_MODE_REPLACE_ALL)
              queue=sync.build_runtime_queue(prefs,publication={'persistent':True,'manifest_url':sync.RUNTIME_MANIFEST_URL})
              plan=sync.plan_runtime_packages(document,queue,sync.RUNTIME_MANIFEST_URL)
              jobs=sync.build_download_jobs(document,plan,sync.RUNTIME_MANIFEST_URL)
              assert jobs['state']=='ready' and len(jobs['jobs'])==1
              assert jobs['jobs'][0]['sha256']==entry['sha256']
              count+=1
          assert count==report['changed_packages']
          report['piconhub_planner_checks']=count
          Path('reports/source-candidates-publication-20261030.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Verified PiconHub planner:',count,'packages')
          PYICON
      - name: Commit content-addressed archives and catalogue together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/source-candidates-publication-20261030.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all(p.startswith('assets/warder/downloads/picons/channels/') or p=='reports/source-candidates-publication-20261030.json' for p in paths),paths
          PY
          if git diff --cached --quiet; then
            echo 'Verified immutable archives are already committed.'
          else
            git commit -m 'Publish verified owner-approved European picon archives and catalogue'
            git push origin HEAD:release/source-candidates-20261030
          fi
      - name: Read back every new public part and verify size and SHA256
        run: python -u tools/publish-source-candidates-20261030.py --verify-public release/source-candidates-20261030
      - name: Record public verification
        shell: bash
        run: |
          set -euo pipefail
          git add --sparse reports/source-candidates-publication-20261030.json
          git commit -m 'Record successful public SHA256 verification of European picon parts'
          git push origin HEAD:release/source-candidates-20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-candidates-publication-verification-20261030
          path: reports/source-candidates-publication-20261030.json
          if-no-files-found: warn
