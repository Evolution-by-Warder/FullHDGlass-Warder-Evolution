name: Publish FullHDGlass 1.0.68 channel picons
on:
  push:
    branches: [release/channel-picons-1.0.68-20261105]
permissions:
  contents: read
concurrency:
  group: fullhdglass-channel-picons-1.0.68
  cancel-in-progress: false
jobs:
  openatv:
    uses: ./.github/workflows/verify-system-screen-compatibility.yml
  openpli:
    uses: ./.github/workflows/verify-openpli-compatibility.yml
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            design
            docs
      - uses: actions/checkout@v4
        with:
          repository: openatv/enigma2
          ref: master
          path: upstream/enigma2
          sparse-checkout: lib/python
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build delta and verify every preserved payload file
        run: |
          python tools/sync_header_version.py --check
          python tools/build-channel-picon-ipk.py
          WARDER_PICON_PACKAGE_ROOT="$PWD/reports/channel-picons-1.0.68/installed/usr/lib/enigma2/python" python tools/test-channel-picons.py --upstream upstream/enigma2/lib/python -v
          python tools/test-runtime-safety.py
      - uses: actions/upload-artifact@v4
        with:
          name: fullhdglass-1.0.68-verified
          path: |
            packages/enigma2-plugin-skins-fullhdglass_1.0.68_all.ipk*
            reports/channel-picons-1.0.68/ipk-verification.json
  publish:
    needs: [build, openatv, openpli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            docs
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: 22fee2af336b0a16508fa01e71568315b0799427
          path: .piconhub-source
          sparse-checkout-cone-mode: false
          sparse-checkout: /plugin/tools/publish_plugin_release.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/download-artifact@v4
        with:
          name: fullhdglass-1.0.68-verified
          path: .release-artifacts
      - name: Publish exact verified package and activate updater feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages reports/channel-picons-1.0.68
          find .release-artifacts -name 'enigma2-plugin-skins-fullhdglass_1.0.68_all.ipk*' -exec cp '{}' packages/ \;
          find .release-artifacts -name ipk-verification.json -exec cp '{}' reports/channel-picons-1.0.68/ \;
          python tools/publish-channel-picons-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: fullhdglass-1.0.68-production
          path: reports/channel-picons-1.0.68/production.json
