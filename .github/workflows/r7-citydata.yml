name: r7 city data build
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  citydata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build authoritative SK+CZ city databases
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/gunsoft/obce-okresy-kraje-slovenska/master/JSON/villages.json -o /tmp/sk-villages.json
          curl -fsSL https://raw.githubusercontent.com/gunsoft/obce-okresy-kraje-slovenska/master/JSON/districts.json -o /tmp/sk-districts.json
          curl -fsSL https://services.cuzk.cz/sestavy/cis/UI_OBEC.zip -o /tmp/UI_OBEC.zip
          curl -fsSL https://services.cuzk.cz/sestavy/cis/UI_OKRES.zip -o /tmp/UI_OKRES.zip
          mkdir -p /tmp/obec /tmp/okres
          unzip -q /tmp/UI_OBEC.zip -d /tmp/obec
          unzip -q /tmp/UI_OKRES.zip -d /tmp/okres
          python3 - <<'PY'
          import csv,glob,collections,json
          sk=json.load(open('/tmp/sk-villages.json',encoding='utf-8'))
          sd=json.load(open('/tmp/sk-districts.json',encoding='utf-8'))
          assert len(sk)==4208
          dm={str(x['id']):x['name'] for x in sd}
          skcnt=collections.Counter(x['fullname'] for x in sk)
          def read_csv(pattern):
              p=glob.glob(pattern)[0]; raw=open(p,'rb').read()
              for enc in ('utf-8-sig','cp1250','latin1'):
                  try: text=raw.decode(enc); break
                  except UnicodeDecodeError: pass
              delim=';' if text[:4096].count(';')>=text[:4096].count(',') else ','
              return list(csv.DictReader(text.splitlines(),delimiter=delim))
          obce=read_csv('/tmp/obec/*'); okresy=read_csv('/tmp/okres/*')
          om={str(r.get('KOD','')).strip():str(r.get('NAZEV','')).strip() for r in okresy}
          cz=[r for r in obce if str(r.get('NAZEV','')).strip() and not str(r.get('PLATI_DO','')).strip()]
          assert len(cz)==6258
          czcnt=collections.Counter(str(r['NAZEV']).strip() for r in cz)
          city=['# Slovakia']; ewea=['# Slovakia']
          for x in sorted(sk,key=lambda r:r['fullname'].casefold()):
              name=x['fullname']; district=dm.get(str(x['district_id']),''); postal=x.get('zip','')
              display=name if skcnt[name]==1 else '%s (%s%s)'%(name,district,(', '+postal) if postal else '')
              city.append('om|%s|%s|SK|%s|%s'%(display,name,district,postal))
              ewea.append('q|%s|SK||Slovakia|%s'%(name,district))
          city+=['','# Czechia']; ewea+=['','# Czechia']
          for r in sorted(cz,key=lambda x:str(x['NAZEV']).casefold()):
              name=str(r['NAZEV']).strip(); district=om.get(str(r.get('OKRES_KOD','')).strip(),'')
              code=str(r.get('KOD','')).strip()\n              display=name if czcnt[name]==1 else '%s (%s, %s)'%(name,district or str(r.get('OKRES_KOD','')).strip(),code)
              city.append('om|%s|%s|CZ|%s|'%(display,name,district))
              ewea.append('q|%s|CZ||Czechia|%s'%(name,(district if czcnt[name]==1 else '%s [%s]'%(district,code))))
          open('work/r7/city_Code-17.txt','w',encoding='utf-8',newline='\n').write('\n'.join(city)+'\n')
          open('work/r7/ewea_city_Code-17.txt','w',encoding='utf-8',newline='\n').write('\n'.join(ewea)+'\n')
          print('SK',len(sk),'CZ',len(cz),'TOTAL',len(sk)+len(cz))
          PY
          test "$(awk -F'|' '$1=="om"&&$4=="SK"{n++}END{print n+0}' work/r7/city_Code-17.txt)" = 4208
          test "$(awk -F'|' '$1=="om"&&$4=="CZ"{n++}END{print n+0}' work/r7/city_Code-17.txt)" = 6258
          test "$(awk -F'|' '$1=="q"&&$3=="SK"{n++}END{print n+0}' work/r7/ewea_city_Code-17.txt)" = 4208
          test "$(awk -F'|' '$1=="q"&&$3=="CZ"{n++}END{print n+0}' work/r7/ewea_city_Code-17.txt)" = 6258
          sha256sum work/r7/city_Code-17.txt work/r7/ewea_city_Code-17.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r7-city-data
          path: |
            work/r7/city_Code-17.txt
            work/r7/ewea_city_Code-17.txt
