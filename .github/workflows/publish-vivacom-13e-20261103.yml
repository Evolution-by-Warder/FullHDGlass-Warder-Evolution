name: Publish Vivacom 13E references
on:
  push:
    branches: [release/vivacom-13e-refs-20261103]
    paths:
      - .github/workflows/publish-vivacom-13e-20261103.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/vivacom-13e-refs-20261103
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/publish-vivacom-13e-20261103.py
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /reports/vivacom-13e-gioppygio-20261103.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Patch and validate nine packages
        run: python tools/publish-vivacom-13e-20261103.py
      - name: Publish immutable archive parts first and catalogue last
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          python - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path('assets/warder/downloads/picons/channels')
          files=sorted(root.glob('warder-130e-*.zip.part*'))
          assert len(files)>=9
          for start in range(0,len(files),2):
              group=files[start:start+2]
              subprocess.run(['git','add','-f','--',*[str(x) for x in group]],check=True)
              subprocess.run(['git','commit','-m',f'Publish verified Vivacom 13E parts {start+1}-{start+len(group)}'],check=True)
              subprocess.run(['git','push','origin','HEAD:release/vivacom-13e-refs-20261103'],check=True)
          subprocess.run(['git','add','--sparse','assets/warder/downloads/picons/channels/manifest.json','assets/warder/downloads/picons/channels/SHA256SUMS'],check=True)
          subprocess.run(['git','commit','-m','Activate Vivacom 13E reference aliases in live catalogue'],check=True)
          subprocess.run(['git','push','origin','HEAD:release/vivacom-13e-refs-20261103'],check=True)
          PY
