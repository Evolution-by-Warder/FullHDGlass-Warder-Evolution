name: Package approved radio 1.0.6
on:
  push:
    branches: [release/approved-radio-1.0.6]
    paths: ['source/**', 'tools/*release*', 'tools/radio-release-baseline.json', 'update*.json', '.github/workflows/publish-approved-radio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    if: github.ref == 'refs/heads/release/approved-radio-1.0.6'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /update.json
            /update-test.json
      - name: Build and verify the exact approved release
        run: |
          python3 tools/build-release-ipk.py
          python3 tools/verify-radio-release.py
      - name: Store the verified IPK on the staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.6_all.ipk packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.6_all.ipk.sha256
          git commit -m 'Store verified approved radio release 1.0.6 IPK'
          git push origin HEAD:refs/heads/release/approved-radio-1.0.6
      - uses: actions/upload-artifact@v4
        with:
          name: approved-radio-1.0.6
          path: |
            packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.6_all.ipk
            packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.6_all.ipk.sha256
