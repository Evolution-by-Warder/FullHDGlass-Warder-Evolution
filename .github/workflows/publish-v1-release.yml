name: Remove legacy GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v1.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
