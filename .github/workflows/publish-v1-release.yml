name: Publish FullHDGlass Warder Evolution v1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure v1.0 release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create v1.0 --repo "$GITHUB_REPOSITORY" \
            --title "FullHDGlass17 Warder Evolution v1.0" \
            --notes "FullHDGlass17 Warder Evolution release line."
