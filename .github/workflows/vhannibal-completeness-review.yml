name: Stage Vhannibal V9 review graphics
on:
  push:
    branches: [work/vhannibal-completeness-20261106]
    paths:
      - reports/vhannibal-completeness-20261106/build-v9-review.py
      - reports/vhannibal-completeness-20261106/repair-input*
      - .github/workflows/vhannibal-completeness-review.yml
permissions:
  contents: write
concurrency:
  group: vhannibal-completeness-review
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/work/vhannibal-completeness-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/vhannibal-completeness-20261106/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==13.0.0 numpy==2.3.5 scipy==1.17.0
      - name: Verify and restore exact audit input
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          b=Path('reports/vhannibal-completeness-20261106');m=json.loads((b/'repair-input-manifest.json').read_bytes());raw=b''
          for p in m['parts']:
              v=(b/p['filename']).read_bytes();assert len(v)==p['bytes'] and hashlib.sha256(v).hexdigest()==p['sha256'];raw+=v
          assert len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==m['sha256'];(b/'repair-input.json.gz').write_bytes(raw)
          PY
      - name: Render exact-source review candidates with frozen masters
        run: python -u reports/vhannibal-completeness-20261106/build-v9-review.py
      - name: Preserve summary and graphic decisions on working branch
        run: |
          test "$GITHUB_REF_NAME" = work/vhannibal-completeness-20261106
          cp candidate-v9-review/summary.json reports/vhannibal-completeness-20261106/v9-review-summary.json
          cp candidate-v9-review/candidate-index.json.gz reports/vhannibal-completeness-20261106/v9-review-index.json.gz
          cp candidate-v9-review/review-sheet-001.png reports/vhannibal-completeness-20261106/v9-review-first-sheet.png
          git config user.name 'Warder audit'
          git config user.email 'warder-picons@users.noreply.github.com'
          git add reports/vhannibal-completeness-20261106/v9-review-summary.json reports/vhannibal-completeness-20261106/v9-review-index.json.gz reports/vhannibal-completeness-20261106/v9-review-first-sheet.png
          git commit -m 'Checkpoint V9 review candidates without production or radio changes'
          git push origin HEAD:refs/heads/work/vhannibal-completeness-20261106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vhannibal-completeness-v9-review
          retention-days: 90
          path: |
            candidate-v9-review/summary.json
            candidate-v9-review/candidate-index.json.gz
            candidate-v9-review/v9-review-assets.zip
            candidate-v9-review/review-sheet-*.png
