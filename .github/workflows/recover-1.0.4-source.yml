name: Recover 1.0.4 runtime source

on:
  push:
    branches:
      - warder-modernization-work
    paths:
      - .github/workflows/recover-1.0.4-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warder-modernization-work
          fetch-depth: 0

      - name: Extract stable 1.0.4 package
        shell: bash
        run: |
          set -euo pipefail
          PKG="packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.4_all.ipk"
          EXPECTED="9ceb1713fa237d39f13b4baf728852323086205528c5622df7def58b5812c0bd"
          test -f "$PKG"
          echo "$EXPECTED  $PKG" | sha256sum -c -

          rm -rf source
          mkdir -p source/package-root source/control source/.extract
          cp "$PKG" source/.extract/package.ipk
          (
            cd source/.extract
            ar x package.ipk
          )

          DATA="$(find source/.extract -maxdepth 1 -type f -name 'data.tar*' -print -quit)"
          CONTROL="$(find source/.extract -maxdepth 1 -type f -name 'control.tar*' -print -quit)"
          test -n "$DATA"
          test -n "$CONTROL"

          tar -xf "$DATA" -C source/package-root
          tar -xf "$CONTROL" -C source/control
          rm -rf source/.extract

          cat > source/README.md <<'EOF'
          # Recovered Warder Evolution 1.0.4 source baseline

          This tree is an exact extraction of the stable
          `enigma2-skin-fullhdglass17-warder-evolution_1.0.4_all.ipk` package.

          Stable package SHA256:
          `9ceb1713fa237d39f13b4baf728852323086205528c5622df7def58b5812c0bd`

          - `package-root/` mirrors the package filesystem payload.
          - `control/` contains package control metadata/scripts.

          This is the implementation baseline for the modernization work.
          Runtime compatibility identifiers must not be cosmetically renamed.
          EOF

      - name: Baseline inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# 1.0.4 recovered baseline inventory"
            echo
            echo "Generated from the SHA256-verified stable package."
            echo
            echo "## Counts"
            echo
            printf -- "- Files: "
            find source/package-root source/control -type f | wc -l
            printf -- "- XML files: "
            find source/package-root -type f -name '*.xml' | wc -l
            printf -- "- Python files: "
            find source/package-root -type f -name '*.py' | wc -l
            printf -- "- PNG files: "
            find source/package-root -type f -name '*.png' | wc -l
            echo
            echo "## Spinner references"
            grep -RniE 'spinner|wait[0-9]*\.png' source/package-root source/control || true
          } > source/BASELINE-INVENTORY.md

      - name: Commit recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Warder Evolution Automation"
          git config user.email "actions@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "source: recover verified 1.0.4 runtime baseline"
          git push origin HEAD:warder-modernization-work
