name: Publish approved station picons
on:
  push:
    branches: [release/approved-new-stations-20261022]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Publish approved station packages')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPROVED_PICON_REF: 255334f4a218266f93441a13987f6f000bdf9ef0
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/publish-approved-stations.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - run: python3 -m pip install 'Pillow==11.3.0'
      - name: Update approved logos and verify unrelated PNG bytes and receiver download plans
        run: python3 -u tools/publish-approved-stations.py
      - name: Commit verified data-only packages
        run: |
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/approved-stations-publication-20261022.json
          git diff --cached --check
          git commit -m 'Refresh approved station picons in satellite download packages'
          git push origin HEAD:release/approved-new-stations-20261022
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-stations-publication-verification
          path: reports/approved-stations-publication-20261022.json
