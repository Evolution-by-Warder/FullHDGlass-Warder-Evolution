name: Publish approved Vhannibal references
on:
  push:
    branches: [picons/vhannibal-approved157-20261105]
    paths:
      - tools/publish-vhannibal-approved157-20261105.py
      - reports/vhannibal-approved157-20261105/publication-plan.json.gz
      - .github/workflows/publish-vhannibal-approved157-20261105.yml
permissions:
  contents: write
concurrency:
  group: warder-vhannibal-approved157-20261105
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/publish-vhannibal-approved157-20261105.py
            /reports/vhannibal-approved157-20261105/
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==13.0.0
      - name: Load pinned approved plan and preservation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,json,hashlib,urllib.request
          b=Path('reports/vhannibal-approved157-20261105')
          (b/'publication-plan.json').write_bytes(gzip.decompress((b/'publication-plan.json.gz').read_bytes()))
          plan=json.loads((b/'publication-plan.json').read_text());g=b/'guard';g.mkdir(exist_ok=True)
          for name,digest in plan['guard_sha256'].items():
              url='https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/'+plan['source_ref']+'/factory/temp/vhannibal-review-20261105/canal235-protection/'+name
              raw=urllib.request.urlopen(url,timeout=90).read();assert hashlib.sha256(raw).hexdigest()==digest
              (g/name).write_bytes(raw)
          PY
      - name: Reuse approved PNGs and preserve original archive records
        run: python -u tools/publish-vhannibal-approved157-20261105.py --root . --inputs reports/vhannibal-approved157-20261105 --cache /tmp/approved-picon-cache
      - name: Validate production catalogue and independent local proof
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,importlib.util
          b=Path('reports/vhannibal-approved157-20261105');plan=json.loads((b/'publication-plan.json').read_text())
          m=Path('assets/warder/downloads/picons/channels/manifest.json');assert hashlib.sha256(m.read_bytes()).hexdigest()==plan['expected_manifest_sha256']
          path='source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py'
          spec=importlib.util.spec_from_file_location('sync',path);s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s);assert s.validate_publication_manifest(json.loads(m.read_text()),'production')==[]
          PY
      - name: Commit immutable archives and verified catalogue
        run: |
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          base='assets/warder/downloads/picons/channels/';b='reports/vhannibal-approved157-20261105/'
          proof=json.load(open(b+'part-git-shas.json'));files=[base+n for n in proof]
          files += [base+'manifest.json',base+'SHA256SUMS',b+'verification.json',b+'part-git-shas.json']
          subprocess.run(['git','add','--sparse','--',*files],check=True)
          PY
          git diff --cached --check
          git commit -m 'Publish approved Vhannibal references and reuse existing canonical masters'
          git push origin HEAD:refs/heads/picons/vhannibal-approved157-20261105
      - uses: actions/upload-artifact@v4
        with:
          name: approved157-verification
          path: |
            reports/vhannibal-approved157-20261105/verification.json
            reports/vhannibal-approved157-20261105/receiver-checks.json
