name: Verify approved radio release
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'update.json'
      - 'update-test.json'
      - 'tools/retain-fullhdglass-stable.py'
      - 'tools/test-retain-four-stable.py'
      - 'docs/RELEASE_RETENTION_POLICY.md'
      - 'docs/ECOSYSTEM-CLEANUP-CHECKPOINT-20261123.md'
      - 'source/**'
      - 'tools/test-radio-*'
      - 'tools/verify-production-release-state.py'
  push:
    branches: [main]
    paths:
      - 'update-production.json'
      - '.github/workflows/verify-radio-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /docs/
            /design/
            /update-production.json
            /update-test.json
            /update.json
            /.github/workflows/verify-radio-release.yml
            /.github/workflows/publish-warder-stable.yml
            /.github/workflows/warder-approved-scope-auto-merge.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only safety check for retired publisher and preserved release path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/publish-warder-1.0.70.yml
          test -s .github/workflows/publish-warder-stable.yml
          test -s .github/workflows/warder-approved-scope-auto-merge.yml
          test -s update-production.json
          echo 'PASS: obsolete release-1.0.70 workflow removed, stable publisher and automatic review retained'
      - name: Verify rollback retention, legacy bootstrap, and current updater feeds (no IPK build)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/test-retain-four-stable.py -v
          python3 -B tools/test-package-transition.py -q
          python3 -B tools/test-legacy-950-upgrade.py -q
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(
              ['git','ls-tree','-r','--name-only','HEAD','packages/'],text=True).splitlines()
          ipks = sorted(x for x in files if x.endswith('.ipk'))
          production=json.loads(Path('update-production.json').read_text())
          testing=json.loads(Path('update-test.json').read_text())
          migration=json.loads(Path('update.json').read_text())
          current=production['version']
          assert re.fullmatch(r'1[.]0[.][0-9]+',current), 'unexpected stable version'
          # Four actual rollback versions in the published feed, not a
          # frozen pre-1.0.85 list. The PR source may legitimately already
          # be the next version while the production feed is still old.
          native_prefix='packages/enigma2-plugin-skins-fullhdglass_'
          retained=sorted(
              (name[len(native_prefix):-len('_all.ipk')] for name in ipks
               if name.startswith(native_prefix) and name.endswith('_all.ipk')
               and name != native_prefix+'1.0.72_all.ipk'),
              key=lambda value: tuple(map(int,value.split('.'))), reverse=True)
          assert len(retained)==4 and retained[0]==current, ('wrong stable retained versions',retained,current)
          expected={native_prefix+v+'_all.ipk' for v in retained+['1.0.72']}
          expected.add('packages/enigma2-skin-fullhdglass-warder-evolution_1.0.18_all.ipk')
          assert set(ipks)==expected, ('wrong IPK retained set', set(ipks)^expected)
          assert all(x+'.sha256' in files for x in expected)
          assert not any(x.endswith('.ipk.sha256') and x.removesuffix('.sha256') not in files for x in files)
          assert testing['version']==production['version']
          assert testing['package_url']==production['package_url']
          assert testing['sha256']==production['sha256']
          assert production['package_url'].endswith('/enigma2-plugin-skins-fullhdglass_'+current+'_all.ipk')
          assert migration['version']=='1.0.18'
          assert migration['package_url'].endswith('/enigma2-skin-fullhdglass-warder-evolution_1.0.18_all.ipk')
          print('PASS: four current stable versions, two documented migration exceptions, no orphan SHA')
          PY
      - name: Verify current source, immutable version headers and country-radio installation safety
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sync_header_version.py --check
          python3 tools/test-radio-production-feed-1.0.83.py -q
          python3 tools/test-radio-bundle-fetch.py -q
          python3 tools/test-radio-world.py -q
          python3 tools/test-radio-approved-country-installer.py -q
          python3 tools/test-radio-country-logo-cleanup.py -q
          python3 tools/test_warder_integrated_skin.py -q
          echo 'PASS: radio country source, signed archive, external storage and approved skin preserved'
      - name: Verify published production package, immutable release and exact SHA256
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="enigma2-plugin-skins-fullhdglass_${version}_all.ipk"
          mkdir -p packages
          # Fetch only the two exact versioned Git objects, not the full 0.5 GB package history.
          git show "HEAD:packages/$package" > "packages/$package"
          git show "HEAD:packages/$package.sha256" > "packages/$package.sha256"
          (cd packages && sha256sum -c "$package.sha256")
          python3 tools/verify-production-release-state.py
          echo 'PASS: current official FullHDGlass stable IPK, feed, tag and radio runtime source'
