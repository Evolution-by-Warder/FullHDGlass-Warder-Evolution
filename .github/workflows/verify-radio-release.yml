name: Verify approved radio release
on:
  push:
    branches: [main, warder-modernization-work]
    paths: ['source/**', 'tools/*release*', 'tools/radio-release-baseline.json', 'update*.json', '.github/workflows/verify-radio-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            design
            docs
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build exactly the checked-in stable or TEST payload
        run: |
          python3 -m pip install --quiet Pillow
          VERSION=$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)
          python3 tools/build-setup-style-test.py
          python3 tools/verify-setup-style-ipk.py
          case "$VERSION" in
            *-test*) ;;
            *)
              FEED_VERSION=$(python3 -c 'import json; print(json.load(open("update.json"))["version"])')
              if [ "$FEED_VERSION" = "$VERSION" ]; then
                cp "packages/test/enigma2-skin-fullhdglass-warder-evolution_${VERSION}_all.ipk" "packages/enigma2-skin-fullhdglass-warder-evolution_${VERSION}_all.ipk"
              fi
              ;;
          esac
      - name: Verify bytecode invalidation and package error details
        run: python3 tools/test-release-bytecode.py
      - name: Verify confirmed graphics, package and update channels
        run: python3 tools/verify-radio-release.py
