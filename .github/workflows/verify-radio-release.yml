name: Verify approved radio release
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/ECOSYSTEM-CLEANUP-CHECKPOINT-20261123.md'
      - 'source/**'
      - 'tools/test-radio-*'
      - 'tools/verify-production-release-state.py'
  push:
    branches: [main]
    paths:
      - 'update-production.json'
      - '.github/workflows/verify-radio-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /docs/
            /design/
            /update-production.json
            /.github/workflows/verify-radio-release.yml
            /.github/workflows/publish-warder-stable.yml
            /.github/workflows/warder-approved-scope-auto-merge.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only safety check for retired publisher and preserved release path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/publish-warder-1.0.70.yml
          test -s .github/workflows/publish-warder-stable.yml
          test -s .github/workflows/warder-approved-scope-auto-merge.yml
          test -s update-production.json
          echo 'PASS: obsolete release-1.0.70 workflow removed, stable publisher and automatic review retained'
      - name: Verify current source, immutable version headers and country-radio installation safety
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sync_header_version.py --check
          python3 tools/test-radio-production-feed-1.0.83.py -q
          python3 tools/test-radio-bundle-fetch.py -q
          python3 tools/test-radio-world.py -q
          python3 tools/test-radio-approved-country-installer.py -q
          python3 tools/test-radio-country-logo-cleanup.py -q
          python3 tools/test_warder_integrated_skin.py -q
          echo 'PASS: radio country source, signed archive, external storage and approved skin preserved'
      - name: Verify published production package, immutable release and exact SHA256
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="enigma2-plugin-skins-fullhdglass_${version}_all.ipk"
          mkdir -p packages
          # Fetch only the two exact versioned Git objects, not the full 0.5 GB package history.
          git show "HEAD:packages/$package" > "packages/$package"
          git show "HEAD:packages/$package.sha256" > "packages/$package.sha256"
          (cd packages && sha256sum -c "$package.sha256")
          python3 tools/verify-production-release-state.py
          echo 'PASS: current official FullHDGlass stable IPK, feed, tag and radio runtime source'
