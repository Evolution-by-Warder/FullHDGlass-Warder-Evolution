name: Verify approved radio release
on:
  push:
    branches: [main, warder-modernization-work]
    paths: ['source/**', 'tools/*release*', 'tools/radio-release-baseline.json', 'update*.json', '.github/workflows/verify-radio-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            design
            docs
            reports
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build exactly the checked-in stable or TEST payload
        run: |
          python3 -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          VERSION=$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)
          if [ "$VERSION" = '1.0.55' ]; then python3 tools/prepare-bitrate-stable-release.py; fi
          python3 tools/build-setup-style-test.py
          python3 tools/verify-setup-style-ipk.py
          PACKAGE_ID=$(sed -n "s/^Package: //p" source/control/control)
          PREFIX="enigma2-plugin-skins-fullhdglass"
          if [ "$PACKAGE_ID" = enigma2-skin-fullhdglass17 ]; then PREFIX=enigma2-skin-fullhdglass-warder-evolution; fi
          case "$VERSION" in
            *-test*) ;;
            *)
              FEED_FILE=update.json
              if [ "$PACKAGE_ID" = enigma2-plugin-skins-fullhdglass-warder-evolution ]; then FEED_FILE=update-production.json; fi
              FEED_VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$FEED_FILE")
              if [ "$FEED_VERSION" = "$VERSION" ]; then
                cp "packages/test/${PREFIX}_${VERSION}_all.ipk" "packages/${PREFIX}_${VERSION}_all.ipk"
              fi
              ;;
          esac
      - name: Verify bytecode invalidation and package error details
        run: python3 tools/test-release-bytecode.py
      - name: Verify confirmed graphics, package and update channels
        run: python3 tools/verify-radio-release.py
