name: Audit live 181 provider PNG additions
on:
  push:
    branches: [audit/italia-provider-supplement-20261124]
    paths: ['.github/workflows/audit-italia-provider-supplement.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import json,hashlib,urllib.request,zipfile,io,struct
          R='https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/'
          F=R+'main/';B=R+'ed4325b3d135ef02e3997b376c61e2394bdd0977/'
          def get(u):
              with urllib.request.urlopen(u,timeout=90) as r:return r.read()
          def sha(b):return hashlib.sha256(b).hexdigest()
          p=json.loads(get(F+'reports/italia-provider-supplement-20261124/plan.json'));a=json.loads(get(F+'assets/warder/downloads.json'))['assets'];old=json.loads(get(B+'assets/warder/downloads.json'))['assets']
          names={x['name'] for x in p['records']};assert len(names)==71
          total=0
          for s,k in [('transparent','piconProv-220'),('white','piconProv-w'),('black','piconProv-b')]:
              loc='assets/warder/downloads/picons/providers/'+s+'/piconProv.zip'
              prev=get(B+loc);cur=get(F+loc);assert sha(prev)==old[k]['sha256'] and sha(cur)==a[k]['sha256'] and len(cur)==a[k]['size']<=32*1024*1024
              ex={'piconProv/'+x['name']:x['variants'][s]['sha256'] for x in p['records'] if s in x['variants']}
              with zipfile.ZipFile(io.BytesIO(prev)) as z0,zipfile.ZipFile(io.BytesIO(cur)) as z:
                  assert z0.testzip() is None and z.testzip() is None and all(z.read(n)==z0.read(n) for n in z0.namelist())
                  if s=='white':
                      assert prev==cur and old[k]==a[k]
                      spec=a[k+'-v2'];entry=spec['extensions'][0]
                      raw=get(entry['url']);assert sha(raw)==entry['sha256'] and len(raw)==entry['size']<=32*1024*1024
                      with zipfile.ZipFile(io.BytesIO(raw)) as ext:
                          assert ext.testzip() is None and set(ext.namelist())==set(ex) and not set(ext.namelist())&set(z.namelist())
                          assert all(sha(ext.read(n))==h and struct.unpack('>II',ext.read(n)[16:24])==(220,132) for n,h in ex.items())
                          assert len(z.namelist())+len(ext.namelist())==spec['png_count']==1447
                          assert sum(x.file_size for x in z.infolist()+ext.infolist())==spec['unpacked_size']
                          assert {'piconProv/'+n for n in names}<=set(z.namelist())|set(ext.namelist())
                  else:
                      assert set(z.namelist())-set(z0.namelist())==set(ex) and len(z.namelist())==a[k]['png_count']
                      assert all(sha(z.read(n))==h and struct.unpack('>II',z.read(n)[16:24])==(220,132) for n,h in ex.items())
                      assert {'piconProv/'+n for n in names}<=set(z.namelist())
                  print(s,len(ex),'new; all existing PNG preserved PASS')
              total+=len(ex)
          assert total==181
          m=get(F+'assets/warder/downloads/picons/channels/manifest.json')
          assert m==get('https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/main/plugin/src/Plugins/Extensions/WarderPiconHub/data/channel-manifest.json')
          print('PASS: 181 PNG published, 71 complete provider names with v2 white, legacy white unchanged, shared DTT manifest unchanged')
          PY
