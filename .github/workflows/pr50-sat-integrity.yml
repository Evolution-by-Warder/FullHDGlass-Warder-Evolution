name: PR50 SAT read-only ZIP integrity

on:
  push:
    branches:
      - work/vhannibal-mezzo-sd-20261106
    paths:
      - .github/workflows/pr50-sat-integrity.yml
      - assets/warder/downloads/picons/channels/manifest.json
      - assets/warder/downloads/picons/channels/SHA256SUMS
  workflow_dispatch:

permissions:
  contents: read

jobs:
  satellite-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only audit inputs (not entire picon repository)
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /reports/vhannibal-followup-20261106/scope-batch-20261116-22/independent-audit.json
          persist-credentials: false

      - name: Validate all manifest entries and reconstruct two batch-22 ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import struct
          import tempfile
          import urllib.request
          import zipfile

          root = pathlib.Path("assets/warder/downloads/picons/channels")
          content = (root / "manifest.json").read_bytes()
          sums_lines = (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines()
          sums = {}
          for line in sums_lines:
              digest, name = line.split("  ", 1)
              assert len(digest) == 64 and name not in sums, name
              sums[name] = digest
          assert sums.pop("manifest.json") == hashlib.sha256(content).hexdigest()
          m = json.loads(content)
          assert m["delivery"] == "raw-github-parts"
          assert len(m["packages"]) >= 498
          assert len(m["parts"]) >= 2132

          parts = {}
          for entry in m["parts"]:
              name = entry["filename"]
              assert name not in parts
              assert entry["bytes"] > 0
              assert sums.pop(name) == entry["sha256"]
              parts[name] = entry
          assert not sums, "unexpected checksum entries"
          source = "https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/"
          location = "/assets/warder/downloads/picons/channels/"
          seen = set()
          names = set()
          for pkg in m["packages"]:
              assert pkg["filename"] not in names
              names.add(pkg["filename"])
              total = 0
              for url in pkg["parts"]:
                  assert url.startswith(source)
                  ref_and_path = url[len(source):]
                  ref, sep, part_name = ref_and_path.partition(location)
                  assert sep and ref in ("main", "work/vhannibal-mezzo-sd-20261106")
                  assert part_name in parts and part_name not in seen
                  seen.add(part_name)
                  total += parts[part_name]["bytes"]
              assert total == pkg["bytes"], pkg["filename"]
          assert seen == set(parts), "orphan or missing part metadata"
          protected = [p for p in m["packages"] if p["selector_id"] in ("CANALPLUS_SK", "CANALPLUS_CZ")]
          assert len(protected) == 18
          print("Manifest metadata PASS:", len(m["packages"]), "packages,", len(parts), "parts")

          audit = json.loads(pathlib.Path(
              "reports/vhannibal-followup-20261106/scope-batch-20261116-22/independent-audit.json"
          ).read_text(encoding="utf-8"))
          assert audit["status"] == "PASS"
          catalog = {p["filename"]: p for p in m["packages"]}
          expected_png = {
              v["reference"]: v["png_sha256"]
              for v in audit["checked_variants"]
              if v["resolution"] == "220x132" and v["family"] == "channel-transparent"
          }
          assert len(expected_png) == 2

          for record in audit["packages"]:
              pkg = catalog[record["filename"]]
              assert pkg["sha256"] == record["sha256"]
              assert pkg["selector_id"] == record["selector_id"]
              with tempfile.TemporaryDirectory() as td:
                  archive_path = pathlib.Path(td) / "candidate.zip"
                  package_sha = hashlib.sha256()
                  total = 0
                  with archive_path.open("wb") as dest:
                      for url in pkg["parts"]:
                          name = url.rsplit("/", 1)[-1]
                          part = parts[name]
                          digest = hashlib.sha256()
                          size = 0
                          request = urllib.request.Request(url, headers={"User-Agent": "Warder-PR50-readonly-integrity"})
                          with urllib.request.urlopen(request, timeout=90) as response:
                              while True:
                                  block = response.read(1024 * 1024)
                                  if not block:
                                      break
                                  dest.write(block)
                                  digest.update(block)
                                  package_sha.update(block)
                                  size += len(block)
                          assert size == part["bytes"], name
                          assert digest.hexdigest() == part["sha256"], name
                          total += size
                  assert total == pkg["bytes"]
                  assert package_sha.hexdigest() == pkg["sha256"]
                  with zipfile.ZipFile(archive_path) as z:
                      assert z.testzip() is None, "ZIP CRC failure"
                      png = z.read(record["reference"] + ".png")
                      assert hashlib.sha256(png).hexdigest() == expected_png[record["reference"]]
                      assert png[:8] == b"\x89PNG\r\n\x1a\n" and png[12:16] == b"IHDR"
                      assert struct.unpack(">II", png[16:24]) == (220, 132)
                      print("ZIP+PNG PASS:", record["selector_id"], len(z.namelist()), "members,", total, "bytes")
          print("PR50 SAT read-only archive validation: PASS; no production release performed")
          PY
