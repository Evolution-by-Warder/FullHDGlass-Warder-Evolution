name: Publish four approved Canal+ channels in all styles
on:
  push:
    branches: [release/canal-four-20261022]
    paths: [.github/workflows/publish-canal-four.yml, tools/replace-canal-four-approved.py, tools/release-canal-four.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/release/canal-four-20261022'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /README.md
            /update.json
            /update-test.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: f64caf688aae368c1b876d49f99e012fbc5cf0a1
          path: .approved-picons
          sparse-checkout: |
            picons/23.5e/canal-plus-sk
            picons/23.5e/canal-plus-cz
            migration/canal-four-approved-20261022
      - name: Update nine packages and verify all PNGs using receiver installer
        run: |
          python3 tools/replace-canal-four-approved.py
          python3 tools/test-complete-canalplus-install.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/canal-four-approved-20261022.json
          git commit -m 'Replace four approved Canal+ channels in all SK/CZ and complete 23.5E colour packages'
          git push origin HEAD:refs/heads/release/canal-four-20261022
      - name: Build and verify minimal release 1.0.12
        run: |
          python3 tools/release-canal-four.py
          git add --sparse source tools/build-complete-canalplus.py README.md update.json update-test.json
          git add --sparse -f packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.12_all.ipk packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.12_all.ipk.sha256
          git commit -m 'Release 1.0.12 with approved Canal+ picons in all styles and packages'
          git push origin HEAD:refs/heads/release/canal-four-20261022
      - uses: actions/upload-artifact@v4
        with:
          name: canal-four-approved-1.0.12
          path: |
            reports/canal-four-approved-20261022.json
            packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.12_all.ipk
            packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.12_all.ipk.sha256
