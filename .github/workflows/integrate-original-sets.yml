name: Integrate supplied satellite sizes
on:
  push:
    branches: [release/original-satellite-sizes-20261022]
permissions:
  contents: write
jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'Prepare supplied satellite integration')
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /README.md
            /update.json
            /update-test.json
            source
            tools
            reports
            docs/PICON-CATALOG-UPDATES.md
            .transfer
            assets/warder/downloads/picons/channels/manifest.json
            assets/warder/downloads/picons/channels/SHA256SUMS
            assets/warder/downloads/picons/channels/test-candidate/manifest.json
            assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
          sparse-checkout-cone-mode: false
      - name: Receive verified original archives
        run: python3 -u tools/receive-original-sets.py
      - name: Dependencies
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 -c 'import ctypes.util; assert ctypes.util.find_library("archive")'
      - name: Append missing PNGs and verify receiver release
        run: |
          python3 -u tools/integrate-original-sets.py
          python3 -u tools/verify-original-catalog-compatibility.py
      - name: Commit verified release on staging branch
        run: |
          git config user.name 'Warder release automation'
          git config user.email 'warder-release@users.noreply.github.com'
          python3 -u tools/commit-original-size-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sizes-release-verification
          path: |
            reports/original-sets-integration-20261022.json
            packages/*1.0.14*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: original-sizes-release-recovery
          compression-level: 0
          path: |
            source/
            tools/
            reports/original-sets-integration-20261022.json
            assets/warder/downloads/picons/channels/
            packages/*1.0.14*
            README.md
            update.json
            update-test.json
