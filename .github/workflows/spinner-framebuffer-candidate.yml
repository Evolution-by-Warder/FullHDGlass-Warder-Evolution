name: FullHDGlass spinner framebuffer candidate
on:
  push:
    branches: [fix/spinner-framebuffer-20261031]
    paths:
      - design/spinner-repair/**
      - tools/*spinner*.py
      - docs/SPINNER-CANDIDATE-20261031.md
      - .github/workflows/spinner-framebuffer-candidate.yml
permissions:
  contents: read
concurrency:
  group: warder-spinner-candidate
  cancel-in-progress: true
jobs:
  openatv-compatibility:
    uses: ./.github/workflows/verify-system-screen-compatibility.yml
  candidate:
    needs: openatv-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            docs
            design
            reports
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install build verification dependencies
        run: |
          python -m pip install --quiet 'Pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg g++
      - name: Compile the actual pinned OpenATV allocation predicate
        shell: bash
        run: |
          set -euo pipefail
          REV=$(python -c 'import json; print(json.load(open("design/spinner-repair/upstream.json"))["revision"])')
          curl --fail --silent --show-error --location --retry 2 --max-time 60 -o /tmp/warder-gpixmap.cpp "https://raw.githubusercontent.com/openatv/enigma2/$REV/lib/gdi/gpixmap.cpp"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 -o /tmp/warder-gpixmap.h "https://raw.githubusercontent.com/openatv/enigma2/$REV/lib/gdi/gpixmap.h"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 -o /tmp/warder-enigma.cpp "https://raw.githubusercontent.com/openatv/enigma2/$REV/main/enigma.cpp"
          python tools/check-spinner-core.py --pixmap /tmp/warder-gpixmap.cpp --header /tmp/warder-gpixmap.h --loader /tmp/warder-enigma.cpp --report reports/spinner-native-allocation-ci.json
      - name: Verify candidate assets, rollback, approved graphics and current runtime
        run: |
          python tools/test-spinner-candidate.py -v
          python tools/test-radio-spectrum.py -q
          python tools/test-runtime-cleanup.py -q
          python tools/test-radio-background.py -q
          python tools/test-radio-lyrics.py -q
          python tools/test-setup-style.py -q
          python tools/test-startup-update.py -q
          python tools/test-runtime-safety.py
          python tools/verify-radio-release.py
      - name: Prepare isolated test package and verify every installed byte
        run: |
          python tools/prepare-spinner-test.py
          python tools/build-setup-style-test.py
          python tools/verify-setup-style-ipk.py
          python tools/verify-spinner-test-ipk.py
      - uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-spinner-candidate
          path: |
            packages/test/enigma2-plugin-skins-fullhdglass_1.0.46-test1_all.ipk
            packages/test/enigma2-plugin-skins-fullhdglass_1.0.46-test1_all.ipk.sha256
            packages/test/spinner-candidate-verification.json
            reports/spinner-native-allocation-ci.json
          retention-days: 30
      - name: Publish one short test IPK without activating production feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="packages/test/enigma2-plugin-skins-fullhdglass_1.0.46-test1_all.ipk"
          if gh release view spinner-1.0.46-test1 >/dev/null 2>&1; then
            mkdir -p /tmp/warder-spinner-immutable
            gh release download spinner-1.0.46-test1 --pattern "$(basename "$PACKAGE")" --dir /tmp/warder-spinner-immutable
            cmp "$PACKAGE" "/tmp/warder-spinner-immutable/$(basename "$PACKAGE")"
          else
            gh release create spinner-1.0.46-test1 "$PACKAGE" "$PACKAGE.sha256" --target "$GITHUB_SHA" --prerelease --latest=false --title "FullHDGlass 1.0.46-test1: spinner" --notes-file docs/SPINNER-CANDIDATE-20261031.md
          fi
