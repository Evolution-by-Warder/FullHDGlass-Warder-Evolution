name: Consolidated recover reviewed missing transparent provider logos
on:
  push:
    branches: [work/italia-legacy-alpha-161-20261124]
    paths: ['.github/workflows/italia-legacy-alpha-161.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-legacy-alpha-161-20261124/*
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
      - run: python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0
      - run: python reports/italia-legacy-alpha-161-20261124/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers/transparent/piconProv.zip reports/italia-legacy-alpha-161-20261124/build.json
          git commit -m "Recover 29 visually verified transparent provider variants"
          git push origin HEAD:work/italia-legacy-alpha-161-20261124
