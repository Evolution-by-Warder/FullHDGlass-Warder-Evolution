name: Build Warder Channel Picon Packages

on:
  workflow_dispatch:
  push:
    branches:
      - warder-modernization-work
    paths:
      - .github/PICON-BUILD-REQUEST

permissions:
  contents: read

jobs:
  build-channel-picons:
    if: github.ref == 'refs/heads/warder-modernization-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FullHDGlass work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout pinned Warder Master source
        uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: 2827fed5b2e6ae4697f08ca57a8c2298079d410f
          path: .warder-master

      - name: Generate audited package plan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-picon-package-plan.py \
            --source-ref 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --output /tmp/picon-package-plan.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/picon-package-plan.json"))
          ready=[x for x in p["selectors"] if x["state"]=="READY"]
          blocked=[x for x in p["selectors"] if x["state"]=="BLOCKED"]
          missing=[x for x in p["selectors"] if x["state"]=="MISSING_SOURCE"]
          assert (len(ready),len(blocked),len(missing))==(38,2,17)
          assert sum(len(x["eligible_families"]) for x in ready)==114
          print("Pinned package plan: PASS (114 packages)")
          PY

      - name: Materialize deterministic packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/warder-picons-a /tmp/warder-picons-b
          mkdir -p /tmp/warder-picons-a /tmp/warder-picons-b
          python3 tools/materialize-picon-packages.py \
            --source-root .warder-master \
            --plan /tmp/picon-package-plan.json \
            --output-dir /tmp/warder-picons-a \
            --manifest /tmp/manifest-a.json \
            --source-commit 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/channel-picons
          python3 tools/materialize-picon-packages.py \
            --source-root .warder-master \
            --plan /tmp/picon-package-plan.json \
            --output-dir /tmp/warder-picons-b \
            --manifest /tmp/manifest-b.json \
            --source-commit 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/channel-picons
          diff -u /tmp/manifest-a.json /tmp/manifest-b.json
          diff -qr /tmp/warder-picons-a /tmp/warder-picons-b
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/manifest-a.json"))
          b=json.load(open("/tmp/manifest-b.json"))
          assert a.get("blocked_packages")==b.get("blocked_packages")
          print("Materializer QC: %d packages, %d blocked" % (len(a["packages"]), len(a.get("blocked_packages",[]))))
          PY
          mkdir -p dist/channel-picons
          cp /tmp/warder-picons-a/*.zip dist/channel-picons/
          cp /tmp/manifest-a.json dist/channel-picons/manifest.json
          (cd dist/channel-picons && sha256sum *.zip | sort -k2 > SHA256SUMS)
          python3 - <<'PY'
          import json
          m=json.load(open("dist/channel-picons/manifest.json"))
          assert len(m["packages"]) + len(m.get("blocked_packages",[])) == 114
          assert not m.get("blocked_packages"), "blocked source packages: %r" % m["blocked_packages"]
          assert m["generated_from"]["ref"]=="2827fed5b2e6ae4697f08ca57a8c2298079d410f"
          names=[p["filename"] for p in m["packages"]]
          assert len(names)==len(set(names))==114
          files=sorted(p.name for p in __import__("pathlib").Path("dist/channel-picons").glob("*.zip"))
          assert files==sorted(names)
          for p in m["packages"]:
              assert p["url"].endswith("/"+p["filename"])
              assert p["bytes"] > 0 and len(p["sha256"]) == 64
          print("Deterministic materialization: PASS; publication remains separate and locked")
          PY

      - name: Validate publication-shaped payload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate-picon-publication.py \
            --root dist/channel-picons \
            --expected-source 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --expected-base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/channel-picons

      - name: Prepare deterministic split publication candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/prepare-picon-publication.py tools/validate-picon-publication.py tools/materialize-picon-packages.py tools/generate-picon-package-plan.py
          python3 tools/validate-channel-picon-publication-plan.py
          rm -rf dist/channel-picons-publish
          python3 tools/prepare-picon-publication.py \
            --input dist/channel-picons \
            --manifest dist/channel-picons/manifest.json \
            --output dist/channel-picons-publish \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/downloads/picons/channels
          python3 tools/validate-picon-publication.py \
            --root dist/channel-picons-publish \
            --manifest dist/channel-picons-publish/manifest.json \
            --expected-source 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --expected-base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/downloads/picons/channels \
            --parts
          python3 - <<'PY'
          import json, pathlib
          m=json.load(open("dist/channel-picons-publish/manifest.json"))
          assert m["delivery"]=="raw-github-parts"
          assert len(m["packages"])==114
          assert len({(p["selector_id"],p["family"],p["resolution"]) for p in m["packages"]})==114
          assert not m.get("blocked_packages"), "split publication contains blocked packages"
          parts=[u for p in m["packages"] for u in p["parts"]]
          assert parts and len(parts)==len(set(parts))
          disk={p.name for p in pathlib.Path("dist/channel-picons-publish").glob("*.part*")}
          expected={u.rsplit("/",1)[-1] for u in parts}
          assert disk==expected
          print("Split publication candidate: PASS (%d parts)"%len(parts))
          PY

      - name: Validate receiver and two-phase cutover gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
          python3 -m py_compile source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
          python3 tools/test-picon-materializer.py
          python3 - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path("tools/materialize-picon-packages.py")
          spec=importlib.util.spec_from_file_location("mat",p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          fixture=bytes((137,80,78,71,13,10,26,10))+bytes((0,0,0,13))+b"IHDR"+__import__("struct").pack(">II",220,132)
          assert m.png_resolution(fixture)=="220x132"
          try:
              m.png_resolution(b"not-png")
          except ValueError:
              pass
          else:
              raise AssertionError("invalid PNG must be rejected")
          print("PNG signature/resolution gate: PASS")
          PY
          python3 tools/test-warder-picon-sync.py
          python3 tools/validate-channel-picon-cutover.py
          python3 tools/validate-channel-picon-two-phase-cutover.py

      - name: Upload audited channel-picon artifact
        uses: actions/upload-artifact@v4
        with:
          name: warder-channel-picons-2827fed5
          path: |
            dist/channel-picons/manifest.json
            dist/channel-picons/SHA256SUMS
            dist/channel-picons-publish/
          if-no-files-found: error
          retention-days: 14
