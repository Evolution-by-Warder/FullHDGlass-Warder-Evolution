name: Build Warder Channel Picon Packages

on:
  workflow_dispatch:
  push:
    branches:
      - warder-modernization-work
    paths:
      - .github/PICON-BUILD-REQUEST

permissions:
  contents: read

jobs:
  build-channel-picons:
    if: github.ref == 'refs/heads/warder-modernization-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FullHDGlass work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout pinned Warder Master source
        uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: 2827fed5b2e6ae4697f08ca57a8c2298079d410f
          path: .warder-master

      - name: Validate pinned legacy migration catalogue
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < assets/warder/legacy-source-manifest.tsv)" -eq 2204
          python3 tools/build-legacy-picon-migration-map.py --mapping assets/warder/picon-satlist-mapping.tsv --source-manifest assets/warder/legacy-source-manifest.tsv --output /tmp/legacy-picon-migration-map.json --runtime-output /tmp/legacy-picon-runtime.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/legacy-picon-migration-map.json"))
          assert len(d["rows"])==399
          assert d["mapped"]==370
          assert d["unmapped"]==29
          runtime=json.load(open("/tmp/legacy-picon-runtime.json"))
          assert len(runtime["archives"])==370
          assert all(u.startswith("https://raw.githubusercontent.com/Evolution-by-Warder/Trezor/9cdda4ab414e7d50a97ca9285db8ebbb75fba615/archives/chocholousek-picons/originals/") for u in runtime["archives"].values())
          assert not any("picon.cz" in u for u in runtime["archives"].values())
          unresolved={(r["selector_id"],r["legacy_column"]) for r in d["rows"] if r["state"]!="ARCHIVED_SOURCE"}
          expected={(s,c) for s in ("450W","31E","749E","851E") for c in (
            "legacy_400x240","legacy_black_50x30","legacy_black","legacy_white_50x30",
            "legacy_white","legacy_oled","legacy_220x132")}
          expected.add(("685E","legacy_400x240"))
          assert unresolved==expected
          print("Legacy catalogue join: PASS (370 mapped, 29 explicitly unresolved)")
          PY

      - name: Validate legacy picon runtime migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test-legacy-picon-runtime.py

      - name: Generate audited package plan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-picon-package-plan.py \
            --source-ref 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --output /tmp/picon-package-plan.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/picon-package-plan.json"))
          ready=[x for x in p["selectors"] if x["state"]=="READY"]
          blocked=[x for x in p["selectors"] if x["state"]=="BLOCKED"]
          missing=[x for x in p["selectors"] if x["state"]=="MISSING_SOURCE"]
          assert (len(ready),len(blocked),len(missing))==(40,0,17)
          assert sum(len(x["eligible_families"]) for x in ready)==120
          print("Pinned package plan: PASS (120 packages; collision exclusions are service scoped)")
          PY

      - name: Materialize deterministic packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/warder-picons-a /tmp/warder-picons-b
          mkdir -p /tmp/warder-picons-a /tmp/warder-picons-b
          python3 tools/materialize-picon-packages.py \
            --source-root .warder-master \
            --plan /tmp/picon-package-plan.json \
            --output-dir /tmp/warder-picons-a \
            --manifest /tmp/manifest-a.json \
            --source-commit 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/channel-picons
          python3 tools/materialize-picon-packages.py \
            --source-root .warder-master \
            --plan /tmp/picon-package-plan.json \
            --output-dir /tmp/warder-picons-b \
            --manifest /tmp/manifest-b.json \
            --source-commit 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/channel-picons
          diff -u /tmp/manifest-a.json /tmp/manifest-b.json
          diff -qr /tmp/warder-picons-a /tmp/warder-picons-b
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/manifest-a.json"))
          b=json.load(open("/tmp/manifest-b.json"))
          assert a.get("blocked_packages")==b.get("blocked_packages")
          print("Materializer QC: %d packages, %d blocked" % (len(a["packages"]), len(a.get("blocked_packages",[]))))
          PY
          mkdir -p dist/channel-picons
          cp /tmp/warder-picons-a/*.zip dist/channel-picons/
          cp /tmp/manifest-a.json dist/channel-picons/manifest.json
          (cd dist/channel-picons && sha256sum *.zip | sort -k2 > SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("dist/channel-picons")
          manifest=root/"manifest.json"
          sums=root/"SHA256SUMS"
          evidence={
              "schema":1,
              "source_commit":"2827fed5b2e6ae4697f08ca57a8c2298079d410f",
              "packages":120,
              "manifest_sha256":hashlib.sha256(manifest.read_bytes()).hexdigest(),
              "sha256sums_sha256":hashlib.sha256(sums.read_bytes()).hexdigest(),
          }
          evidence_path=root/"BUILD-EVIDENCE.json"
          with evidence_path.open("w", encoding="utf-8", newline="\n") as f:
              json.dump(evidence,f,sort_keys=True,indent=2)
              f.write(chr(10))
          assert json.load(evidence_path.open("r",encoding="utf-8"))==evidence
          print("Build evidence hashes:", evidence["manifest_sha256"], evidence["sha256sums_sha256"])
          PY
          python3 - <<'PY'
          import json
          m=json.load(open("dist/channel-picons/manifest.json"))
          assert len(m["packages"]) + len(m.get("blocked_packages",[])) == 120
          assert not m.get("blocked_packages"), "blocked source packages: %r" % m["blocked_packages"]
          assert m["generated_from"]["ref"]=="2827fed5b2e6ae4697f08ca57a8c2298079d410f"
          names=[p["filename"] for p in m["packages"]]
          assert len(names)==len(set(names))==120
          files=sorted(p.name for p in __import__("pathlib").Path("dist/channel-picons").glob("*.zip"))
          assert files==sorted(names)
          for p in m["packages"]:
              assert p["url"].endswith("/"+p["filename"])
              assert p["bytes"] > 0 and len(p["sha256"]) == 64
          print("Deterministic materialization: PASS; publication state is validated separately")
          PY

      - name: Validate publication-shaped payload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate-picon-publication.py \
            --root dist/channel-picons \
            --expected-source 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --expected-base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/channel-picons \
            --expected-packages 120

      - name: Prepare deterministic split publication candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/prepare-picon-publication.py tools/validate-picon-publication.py tools/materialize-picon-packages.py tools/generate-picon-package-plan.py
          python3 tools/validate-channel-picon-publication-plan.py
          rm -rf dist/channel-picons-publish
          python3 tools/prepare-picon-publication.py \
            --input dist/channel-picons \
            --manifest dist/channel-picons/manifest.json \
            --output dist/channel-picons-publish \
            --expected-packages 120 \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/downloads/picons/channels
          python3 tools/validate-picon-publication.py \
            --root dist/channel-picons-publish \
            --manifest dist/channel-picons-publish/manifest.json \
            --expected-source 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --expected-base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/assets/warder/downloads/picons/channels \
            --expected-packages 120 \
            --parts
          python3 - <<'PY'
          import json, pathlib
          m=json.load(open("dist/channel-picons-publish/manifest.json"))
          assert m["delivery"]=="raw-github-parts"
          assert len(m["packages"])==120
          assert len({(p["selector_id"],p["family"],p["resolution"]) for p in m["packages"]})==120
          assert not m.get("blocked_packages"), "split publication contains blocked packages"
          parts=[u for p in m["packages"] for u in p["parts"]]
          assert parts and len(parts)==len(set(parts))
          disk={p.name for p in pathlib.Path("dist/channel-picons-publish").glob("*.part*")}
          expected={u.rsplit("/",1)[-1] for u in parts}
          assert disk==expected
          print("Split publication candidate: PASS (%d parts)"%len(parts))
          PY

      - name: Validate receiver and two-phase cutover gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
          python3 -m py_compile source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
          python3 tools/test-picon-materializer.py
          python3 tools/test-picon-publication-integrity.py
          python3 - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path("tools/materialize-picon-packages.py")
          spec=importlib.util.spec_from_file_location("mat",p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          fixture=bytes((137,80,78,71,13,10,26,10))+bytes((0,0,0,13))+b"IHDR"+__import__("struct").pack(">II",220,132)
          assert m.png_resolution(fixture)=="220x132"
          try:
              m.png_resolution(b"not-png")
          except ValueError:
              pass
          else:
              raise AssertionError("invalid PNG must be rejected")
          print("PNG signature/resolution gate: PASS")
          PY
          python3 tools/test-warder-picon-sync.py
          python3 tools/validate-channel-picon-cutover.py
          python3 tools/validate-channel-picon-two-phase-cutover.py
          python3 tools/validate-channel-picon-publication-plan.py

      - name: Publish approved persistent channel-picon backend to main
        shell: bash
        run: |
          set -euo pipefail
          APPROVAL="PRODUCTION_PUBLISH_APPROVED_ONCE: warder-channel-picons-20261005"
          if ! grep -Fxq "$APPROVAL" .github/PICON-BUILD-REQUEST; then
            echo "No one-time production publication approval marker; skipping."
            exit 0
          fi

          # Fail closed unless this build is byte-for-byte tied to the approved reproducible source evidence.
          python3 - <<'PY'
          import json
          e=json.load(open("dist/channel-picons/BUILD-EVIDENCE.json"))
          assert e["source_commit"]=="2827fed5b2e6ae4697f08ca57a8c2298079d410f"
          assert e["packages"]==114
          assert e["manifest_sha256"]=="493e05b33882b45d827f2ab13b80250d4db307f8d0430885b9b50ba8ac37ef6c"
          assert e["sha256sums_sha256"]=="791b91f26f6624945ba0c61ce2aa756706bd0900f2914dbda2a90661a90c8982"
          print("Approved reproducible content fingerprint: PASS")
          PY

          rm -rf dist/channel-picons-production
          python3 tools/prepare-picon-publication.py \
            --input dist/channel-picons \
            --manifest dist/channel-picons/manifest.json \
            --output dist/channel-picons-production \
            --base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/main/assets/warder/downloads/picons/channels
          python3 tools/validate-picon-publication.py \
            --root dist/channel-picons-production \
            --manifest dist/channel-picons-production/manifest.json \
            --expected-source 2827fed5b2e6ae4697f08ca57a8c2298079d410f \
            --expected-base-url https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/main/assets/warder/downloads/picons/channels \
            --parts

          test "$(find dist/channel-picons-production -type f -name '*.part*' | wc -l)" -eq 124
          test -f dist/channel-picons-production/manifest.json
          test -f dist/channel-picons-production/SHA256SUMS

          git fetch origin main
          test "$(git rev-parse origin/main)" = "ca7fad961a2eaa3be97511a7d715601d93697458"
          git worktree add /tmp/warder-production origin/main
          DEST=/tmp/warder-production/assets/warder/downloads/picons/channels
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a dist/channel-picons-production/. "$DEST"/

          cd /tmp/warder-production
          # Publication only: runtime/source files are deliberately not copied to main.
          git status --short
          test "$(find assets/warder/downloads/picons/channels -type f -name '*.part*' | wc -l)" -eq 124
          git add assets/warder/downloads/picons/channels
          git diff --cached --quiet && { echo "Publication produced no changes"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified Warder channel picon backend"
          git push origin HEAD:main

      - name: Upload audited channel-picon artifact
        uses: actions/upload-artifact@v4
        with:
          name: warder-channel-picons-2827fed5
          path: |
            dist/channel-picons/manifest.json
            dist/channel-picons/SHA256SUMS
            dist/channel-picons/BUILD-EVIDENCE.json
            dist/channel-picons-publish/
          if-no-files-found: error
          retention-days: 14
