name: Build FullHDGlass FastScan EPG TEST IPK
on:
  pull_request:
    paths:
      - 'source/package-root/usr/lib/enigma2/python/Components/Renderer/WarderChannelEpgClip.py'
      - 'tools/test_fastscan_epg_name_geometry.py'
      - 'tools/test_fastscan_epg_owner_sync.py'
      - 'tools/test_fastscan_epg_repaint_cache.py'
      - 'tools/test_fastscan_epg_invisible_rows.py'
      - '.github/workflows/build-fastscan-epg-test-ipk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-test-ipk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            source
            tools/build-release-ipk.py
            tools/sync_header_version.py
            tools/test_fastscan_epg_name_geometry.py
            tools/test_fastscan_epg_owner_sync.py
            tools/test_fastscan_epg_repaint_cache.py
            tools/test_fastscan_epg_invisible_rows.py
            tools/test_warder_channel_epg_clip.py
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify FastScan regression before packing
        run: |
          set -euo pipefail
          python3 tools/test_fastscan_epg_name_geometry.py -q
          python3 tools/test_fastscan_epg_owner_sync.py -q
          python3 tools/test_fastscan_epg_repaint_cache.py -q
          python3 tools/test_fastscan_epg_invisible_rows.py -q
          python3 tools/test_warder_channel_epg_clip.py -q
      - name: Stage isolated version without modifying committed production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          runtime=Path('source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version')
          meta=Path('source/control/control')
          assert runtime.read_text().strip() == '1.0.80'
          text=meta.read_text()
          assert text.count('Version: 1.0.80-1\n') == 1
          runtime.write_text('1.0.81-test4\n')
          meta.write_text(text.replace('Version: 1.0.80-1\n', 'Version: 1.0.81-test4-1\n'))
          PY
          python3 tools/sync_header_version.py
          python3 tools/sync_header_version.py --check
      - name: Build verified test-only IPK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,subprocess,tempfile
          from pathlib import Path
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location('builder',root/'tools/build-release-ipk.py')
          builder=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          source=root/'source/package-root'
          control=root/'source/control'
          assert (source/'usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version').read_text().strip()=='1.0.81-test4'
          assert 'Version: 1.0.81-test4-1\n' in (control/'control').read_text()
          renderer=source/'usr/lib/enigma2/python/Components/Renderer/WarderChannelEpgClip.py'
          code=renderer.read_text()
          assert 'reference_name = ref.getName() or ""' in code
          assert 'self._warder_owner_screen = parent' in code
          assert 'component = screen["list"]' in code
          assert 'rows = [ref for ref in raw_rows' in code
          assert 'native_measure = NativeLabel.calculateTextSize' in code
          assert "name_width = max(name_width, native_column)" in code
          for name in ('preinst','postinst','postrm'):
              assert (control/name).is_file()
          output=root/'packages/test/enigma2-plugin-skins-fullhdglass_1.0.81-test4_all.ipk'
          output.parent.mkdir(parents=True,exist_ok=True)
          with tempfile.TemporaryDirectory() as folder:
              tmp=Path(folder)
              (tmp/'debian-binary').write_bytes(b'2.0\n')
              builder.archive(control,tmp/'control.tar.gz')
              builder.archive(source,tmp/'data.tar.gz',payload=True)
              subprocess.run(['ar','rcsD',str(output),'debian-binary','control.tar.gz','data.tar.gz'],cwd=tmp,check=True)
          sha=hashlib.sha256(output.read_bytes()).hexdigest()
          checksum=output.with_suffix('.ipk.sha256')
          checksum.write_text(sha+'  '+output.name+'\n')
          print('TEST IPK',output.name, 'bytes',output.stat().st_size,'sha256',sha)
          PY
          test "$(ar t packages/test/enigma2-plugin-skins-fullhdglass_1.0.81-test4_all.ipk | paste -sd' ' -)" = "debian-binary control.tar.gz data.tar.gz"
          (cd packages/test && sha256sum -c enigma2-plugin-skins-fullhdglass_1.0.81-test4_all.ipk.sha256)
          ! grep -q 'Version: 1.0.80-1' <(ar p packages/test/enigma2-plugin-skins-fullhdglass_1.0.81-test4_all.ipk control.tar.gz | tar -xzO ./control)
      - name: Upload isolated TEST IPK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-1.0.81-test4-FastScan-EPG
          path: |
            packages/test/enigma2-plugin-skins-fullhdglass_1.0.81-test4_all.ipk
            packages/test/enigma2-plugin-skins-fullhdglass_1.0.81-test4_all.ipk.sha256
          if-no-files-found: error
          retention-days: 14
