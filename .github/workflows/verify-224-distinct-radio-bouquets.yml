jobs:
  native-country-bouquet-and-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/
            /source/package-root/usr/lib/enigma2/python/Components/Renderer/
            /tools/test-radio-224-real-country-bouquets.py
            /tools/test-radio-224-online-fallback-and-logos.py
            /tools/test-radio-local-test-assets.py
            /tools/test-radio-bundled-world-test141.py
            /tools/test-radio-approved-country-installer.py
            /tools/test-radio-country-logo-cleanup.py
            /tools/test-radio-single-country-startup142.py
            /tools/test-radio-packages.py
            /tools/test-radio-world.py
            /tools/test-radio-world-gui.py
            /tools/test-radio-224-signed-zip-only145.py
            /tools/test-radio-country-close-list145.py
            /tools/test-radio-country.py
            /source/control/postinst
            /tools/test-radio-bundle-fetch.py
      - name: Strict Python source and offline native radio-group tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 -B tools/test-radio-224-real-country-bouquets.py -v
          python3 -B tools/test-radio-224-online-fallback-and-logos.py -v
          python3 -B tools/test-radio-local-test-assets.py -v
          python3 -B tools/test-radio-bundled-world-test141.py -v
          python3 -B tools/test-radio-approved-country-installer.py -v
          python3 -B tools/test-radio-country-logo-cleanup.py -v
          python3 -B tools/test-radio-single-country-startup142.py -v
          python3 -B tools/test-radio-packages.py -v
          python3 -B tools/test-radio-world.py -v
          python3 -B tools/test-radio-world-gui.py -v
          python3 -B tools/test-radio-224-signed-zip-only145.py -v
          python3 -B tools/test-radio-country-close-list145.py -v
          python3 -B tools/test-radio-country.py -v
          python3 -B tools/test-radio-bundle-fetch.py -v
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17').glob('*.py'):
              ast.parse(p.read_text(encoding='utf-8'),str(p))
          print('Installed skin native radio source AST PASS')
          PY
