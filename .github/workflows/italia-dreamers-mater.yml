name: Italia Digital Dreamers and Radio Mater DAB provider package
on:
  push:
    branches: [work/italia-final-41-20261124]
    paths: ['reports/italia-final-41-20261124/dreamers-mater.py', '.github/workflows/italia-dreamers-mater.yml']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: reports/italia-final-41-20261124
      - uses: actions/checkout@v4
        with:
          ref: deb96b7808b5abbca87b02897e4537938219e5d8
          path: production
          fetch-depth: 1
          sparse-checkout: |
            assets/warder/downloads/picons/providers
            assets/warder/downloads.json
            assets/warder/downloads/picons/channels/manifest.json
            reports/dtt-italia-20261123/recipe.json
            reports/italia-dtt-vhannibal-19-20261124/plan.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: italia-vr-eclutch-proof
          run-id: 45561759130
          github-token: ${{ github.token }}
          path: reviewed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python reports/italia-final-41-20261124/dreamers-mater.py production reviewed
      - name: Commit verified variants to separate branch
        run: |
          cd production
          test "$(git rev-parse HEAD)" = "deb96b7808b5abbca87b02897e4537938219e5d8"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers/{black,transparent}/piconProv.zip assets/warder/downloads/picons/providers/white/extension-04/piconProv.zip reports/italia-dreamers-mater-20261125
          git diff --cached --stat
          git commit -m "Complete Digital Dreamers aliases and verified Radio Mater DAB donor"
          git push origin HEAD:refs/heads/publish/italia-dreamers-mater-20261125
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: italia-dreamers-mater-proof
          path: |
            production/reports/italia-dreamers-mater-20261125/
