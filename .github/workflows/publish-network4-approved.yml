name: Publish approved Network4 picons
on:
  push:
    branches: [release/network4-approved-20261022]
concurrency:
  group: warder-network4-publication
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Publish approved Network4 packages')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPROVED_PICON_REF: 09e6e6ed78f3dbd18daeefe3fb88108e14f4e9d7
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/publish-network4-approved.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - run: python3 -m pip install 'Pillow==11.3.0'
      - name: Publish exact approved artwork and verify unrelated files
        run: python3 -u tools/publish-network4-approved.py
      - name: Commit verified data-only archives
        run: |
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/network4-publication-20261022.json
          git diff --cached --check
          git commit -m 'Refresh approved Network4 and contrast corrections in picon archives'
          git push origin HEAD:release/network4-approved-20261022
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network4-publication-verification
          path: reports/network4-publication-20261022.json
