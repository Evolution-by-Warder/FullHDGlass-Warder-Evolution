name: Build reviewed Italia follow-up (sparse checkout)
on:
  push:
    branches: [work/italia-followup-sparse-20261124]
    paths: ['.github/workflows/italia-followup-sparse.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/apply-italia-followup.py
            /reports/italia-followup-20261124/plan.json
            /reports/dtt-italia-20261123/recipe.json
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
      - name: Select exactly the current DTT archive parts
        run: |
          python3 - <<'PY' > /tmp/parts
          import json
          m=json.load(open('assets/warder/downloads/picons/channels/manifest.json'))
          for p in m['packages']:
              if p['selector_id']=='DTT_ITALIA':
                  for u in p['parts']:
                      print('/assets/warder/downloads/picons/channels/'+u.rsplit('/',1)[-1])
          PY
          git sparse-checkout add --stdin < /tmp/parts
      - run: python3 tools/apply-italia-followup.py
      - name: Commit only candidate archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads/picons/channels assets/warder/downloads/picons/providers assets/warder/downloads.json reports/italia-followup-20261124/build.json
          git diff --cached --name-only
          git commit -m "Build verified 201 Italian alias PNGs from pinned baseline"
          git push origin HEAD:work/italia-followup-sparse-20261124
