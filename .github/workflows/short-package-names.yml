name: Publish short installation package name
on:
  push:
    branches: [release/short-package-names-20261030]
    paths: ['.github/workflows/short-package-names.yml', 'tools/publish-short-package-name.py', 'docs/short-package-name-20261030.json']
permissions:
  contents: write
concurrency:
  group: short-package-names-20261030
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            source
            design
            docs
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install Pillow
      - name: Check release publication compatibility
        run: |
          python tools/test-native-skin-publisher.py -q
          python tools/test-canonical-picons.py -q
      - name: Publish identical verified production bytes under shorter name
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish-short-package-name.py
      - name: Record public verification and optional updater download
        run: |
          git config user.name 'Warder release automation'
          git config user.email 'warder-release@users.noreply.github.com'
          git add --sparse -f reports/short-package-name-20261030.json packages/enigma2-plugin-skins-fullhdglass_1.0.41_all.ipk packages/enigma2-plugin-skins-fullhdglass_1.0.41_all.ipk.sha256
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified short production IPK name with unchanged package bytes'
            git push origin HEAD:release/short-package-names-20261030
          fi
