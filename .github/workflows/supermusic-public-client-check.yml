name: Verify normal SuperMusic visitor session
on:
  workflow_dispatch:
  push:
    branches: [feature/radio-lyrics-layout]
    paths:
      - .github/workflows/supermusic-public-client-check.yml
      - diagnostics/supermusic_session.py
      - diagnostics/probe-supermusic-session.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch only the bounded public visitor-session diagnostic
        env:
          SOURCE_ROOT: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p /tmp/warder-supermusic-session
          for file in supermusic_session.py probe-supermusic-session.py; do
            curl --fail --location --max-time 20 --output "/tmp/warder-supermusic-session/$file" "$SOURCE_ROOT/diagnostics/$file"
          done
      - run: python3 /tmp/warder-supermusic-session/probe-supermusic-session.py
