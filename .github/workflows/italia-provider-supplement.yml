name: Build and install-test consolidated 181 provider picons
on:
  push:
    branches: [work/italia-provider-supplement-20261124]
    paths: ['.github/workflows/italia-provider-supplement.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-provider-supplement-20261124/*
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderCanonicalPicons.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
      - run: python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0
      - run: python reports/italia-provider-supplement-20261124/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers reports/italia-provider-supplement-20261124/build.json reports/italia-provider-supplement-20261124/plan.json
          git commit -m "Complete 71 supplied provider names across 181 missing variants"
          git push origin HEAD:work/italia-provider-supplement-20261124
