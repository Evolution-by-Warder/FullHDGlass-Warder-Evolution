name: FullHDGlass TEST153 consolidated skin and radio IPK
on:
  push:
    branches:
      - integration/fullhdglass-all-approved-radio-20261122
    paths:
      - .github/workflows/fullhdglass-integrated-test153-ipk.yml
      - tools/build-fullhdglass-integrated-test153.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/screenSaver.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderRadioSaverController.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderRadioSaverLayout.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderRadioRds.py
      - source/package-root/usr/lib/enigma2/python/Components/Renderer/g17MenuEntry2.py
      - source/package-root/usr/lib/enigma2/python/Components/Converter/g17ServiceNum.py
      - tools/test_iptv_infobar_service_name.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-skin-test153:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout current TEST153 integration branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /design/
            /assets/warder/downloads/ui/spinners/
            /assets/warder/channel-picon-build.json
            /assets/warder/runtime-network-dependencies.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate unified saver and package source
        run: |
          set -euo pipefail
          python3 -B tools/test_unified_radio_saver.py
          python3 -B tools/test-channel-picon-settings.py -q
          python3 -B tools/test_iptv_infobar_service_name.py -q
          python3 -B tools/test_warder_primetime_placements.py -q
          python3 -B tools/test_warder_menu_icon_bindings.py -q
          python3 -B tools/test_warder_integrated_skin.py -q
          python3 -B tools/test-radio-live.py -q
          python3 -B tools/test-radio-hidden-list-refresh147.py -q
          test "$(git hash-object assets/warder/downloads/picons/channels/manifest.json)" = "7a7c6b4b96d9b8dc2da60a29c85ae1bd2069b715"
          test "$(git hash-object assets/warder/downloads/picons/channels/SHA256SUMS)" = "e94b5342b8d3d82371ccfbc5898e397d7819a3bb"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path("source/package-root")
          count=0
          for item in root.rglob("*.py"):
              ast.parse(item.read_text(encoding="utf-8"), filename=str(item), feature_version=(3,9))
              count+=1
          assert count>100, count
          print("Enigma Python 3.9 source parse PASS",count)
          PY
          for s in preinst postinst prerm postrm; do sh -n "source/control/$s"; done
          test "$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)" = "1.0.80"

      - name: Build complete radio screensaver TEST153 IPK
        run: |
          set -euo pipefail
          python3 -B tools/build-fullhdglass-integrated-test153.py

      - name: Verify test package content, installer identity and checksum
        run: |
          set -euo pipefail
          cd packages/fullhdglass-unified-radio-test153
          sha256sum -c enigma2-plugin-skins-fullhdglass_1.0.81-test153_all.ipk.sha256
          python3 - <<'PY'
          import io, json, hashlib, subprocess, tarfile
          from pathlib import Path
          name="enigma2-plugin-skins-fullhdglass_1.0.81-test153_all.ipk"
          p=Path(name)
          meta=json.loads(Path("fullhdglass-1.0.81-test153-manifest.json").read_text())
          assert p.is_file() and p.stat().st_size < 22*1024*1024
          assert meta["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert meta["test_only"] and meta["production_modified"] is False
          assert meta["runtime_version"]=="1.0.81-test153"
          assert subprocess.check_output(["ar","t",str(p)],text=True).splitlines()==[
              "debian-binary","control.tar.gz","data.tar.gz"]
          def entries(part):
              raw=subprocess.check_output(["ar","p",str(p),part])
              with tarfile.open(fileobj=io.BytesIO(raw),mode="r:gz") as z:
                  return {m.name:z.extractfile(m).read() for m in z.getmembers() if m.isfile()}
          ctl=entries("control.tar.gz")
          control=ctl["./control"].decode()
          assert "Version: 1.0.81-test153-1" in control
          assert "Package: enigma2-plugin-skins-fullhdglass-warder-evolution" in control
          data=entries("data.tar.gz")
          root="./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/"
          for file in ("plugin.py","screenSaver.py","warderRadioSaverController.py",
                       "warderRadioSaverLayout.py","warderRadioRds.py"):
              assert root+file in data, file
          assert data[root+"version"].strip()==b"1.0.81-test153"
          assert b"radioSaverDelay" in data[root+"plugin.py"]
          assert b"_is_radio" in data[root+"warderRadioSaverController.py"]
          assert b"bounded_motion" in data[root+"warderRadioSaverLayout.py"]
          assert b"native_rds" in data[root+"warderRadioRds.py"]
          assert b"native_rds(service)" in data[root+"screenSaver.py"]
          assert b"cached_country_picon" in data[root+"screenSaver.py"]
          assert b"radio_stems" in data[root+"screenSaver.py"]
          menu="./usr/lib/enigma2/python/Components/Renderer/g17MenuEntry2.py"
          assert menu in data and b"PiconHub_Warder_Evolution" in data[menu]
          assert b"glass_sys_utils" in data[menu]
          service_converter="./usr/lib/enigma2/python/Components/Converter/g17ServiceNum.py"
          assert service_converter in data
          assert b"current_ref.getName()" in data[service_converter]
          assert b"number = self.isEnaNumber()" in data[service_converter]
          assert "./usr/share/enigma2/hd_glass17/radio-world/radio-countries-bouquets.zip" not in data
          print("TEST153 IPK CONTROL/PAYLOAD/SHA VERIFIED",len(data),p.stat().st_size,meta["sha256"])
          PY

      - name: Upload standalone test-only IPK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-1.0.81-test153-Unified-Radio-Saver-TEST-IPK
          path: |
            packages/fullhdglass-unified-radio-test153/enigma2-plugin-skins-fullhdglass_1.0.81-test153_all.ipk
            packages/fullhdglass-unified-radio-test153/enigma2-plugin-skins-fullhdglass_1.0.81-test153_all.ipk.sha256
            packages/fullhdglass-unified-radio-test153/fullhdglass-1.0.81-test153-manifest.json
          if-no-files-found: error
          retention-days: 30
