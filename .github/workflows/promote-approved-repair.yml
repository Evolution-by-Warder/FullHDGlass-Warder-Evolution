name: Promote approved receiver repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-approved-repair.yml, docs/APPROVED-REPAIR-RELEASE.md]
permissions:
  contents: read
concurrency:
  group: approved-receiver-repair
  cancel-in-progress: true
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Evolution-by-Warder/FullHDGlass-Warder-Evolution
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Verify immutable public IPK and checksum before promotion
        run: |
          set -euo pipefail
          mkdir /tmp/approved-repair
          gh release download 'v1.0.52' --pattern 'enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk' --pattern 'enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk.sha256' --dir /tmp/approved-repair
          test "$(stat -c %s '/tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk')" = '16724360'
          printf '%s  %s\n' '63196da663a7ffb1f39b0a935c677bdfe55c4d19deba6bfc9a17de155f9c3bdd' '/tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk' | sha256sum --check
          cd /tmp/approved-repair
          sha256sum --check 'enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk.sha256'
      - name: Promote existing release without rebuilding or replacing assets
        run: |
          set -euo pipefail
          gh release edit 'v1.0.52' --draft=false --prerelease=false --latest --notes-file docs/APPROVED-REPAIR-RELEASE.md
          gh release view 'v1.0.52' --json tagName,isDraft,isPrerelease,assets
      - name: Publish the same verified bytes at the installed updater URL
        run: |
          set -euo pipefail
          mkdir -p packages
          cp /tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk packages/
          cp /tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk.sha256 packages/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -f packages/enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk packages/enigma2-plugin-skins-fullhdglass_1.0.52_all.ipk.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified FullHDGlass 1.0.52 bytes at compatible updater URL'
            git push origin HEAD:main
          fi
