name: Promote approved receiver repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-approved-repair.yml, docs/APPROVED-REPAIR-RELEASE.md]
permissions:
  contents: read
concurrency:
  group: approved-receiver-repair
  cancel-in-progress: true
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Evolution-by-Warder/FullHDGlass-Warder-Evolution
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Verify immutable public IPK and checksum before promotion
        run: |
          set -euo pipefail
          mkdir /tmp/approved-repair
          gh release download 'v1.0.59' --pattern 'enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk' --pattern 'enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk.sha256' --dir /tmp/approved-repair
          test "$(stat -c %s '/tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk')" = '17206616'
          printf '%s  %s\n' '2c4a1b53cd0817bf4a49e29a37284dd909b2ee3bfe4f9568c7d3845eaaf4faee' '/tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk' | sha256sum --check
          cd /tmp/approved-repair
          sha256sum --check 'enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk.sha256'
      - name: Promote existing release without rebuilding or replacing assets
        run: |
          set -euo pipefail
          gh release edit 'v1.0.59' --draft=false --prerelease=false --latest --notes-file docs/APPROVED-REPAIR-RELEASE.md
          gh release view 'v1.0.59' --json tagName,isDraft,isPrerelease,assets
      - name: Publish the same verified bytes at the installed updater URL
        run: |
          set -euo pipefail
          mkdir -p packages
          cp /tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk packages/
          cp /tmp/approved-repair/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk.sha256 packages/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          bridge = Path('update.json').read_bytes()
          assert json.loads(bridge)['version'] == '1.0.18'
          package = Path('packages/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk')
          assert hashlib.sha256(package.read_bytes()).hexdigest() == '2c4a1b53cd0817bf4a49e29a37284dd909b2ee3bfe4f9568c7d3845eaaf4faee'
          for filename in ('update-production.json', 'update-test.json'):
              data = json.loads(Path(filename).read_text())
              assert data['version'] in ('1.0.57', '1.0.59'), filename
              data.update(version='1.0.59',
                  package_url='https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/main/packages/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk',
                  sha256='2c4a1b53cd0817bf4a49e29a37284dd909b2ee3bfe4f9568c7d3845eaaf4faee',
                  changelog='Čitateľné farebné tlačidlá a trvalé Menu v LCD4linux, prehľadnejšie Rýchle menu a správne farebné prúžky aj na TV. Po aktualizácii reštartujte GUI.')
              Path(filename).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          assert Path('update.json').read_bytes() == bridge
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -f packages/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk packages/enigma2-plugin-skins-fullhdglass_1.0.59_all.ipk.sha256 update-production.json update-test.json
          if ! git diff --cached --quiet; then
            git commit -m 'Activate verified FullHDGlass 1.0.59 package and native update feeds atomically'
            git push origin HEAD:main
          fi
