name: Consolidated verified Italian provider batch
on:
  push:
    branches: [work/italia-final-verified-batch-20261124]
    paths: ['.github/workflows/italia-final-verified-batch.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-final-verified-batch-20261124/*
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
      - run: python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5
      - run: python reports/italia-final-verified-batch-20261124/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers reports/italia-final-verified-batch-20261124/build.json
          git commit -m "Build consolidated 142 reviewed provider variants for 70 names"
          git push origin HEAD:work/italia-final-verified-batch-20261124
