name: FullHDGlass Czech native config spacing REVIEW IPK

on:
  pull_request:
    paths:
      - '.github/workflows/native-config-spacing-review-ipk.yml'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderNativeConfigSpacing.py'
      - 'source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderLocale.py'
      - 'tools/test-native-config-spacing.py'

permissions:
  contents: read

jobs:
  review-ipk:
    name: Build isolated receiver REVIEW IPK (no feeds)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            source
            tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused geometry and import regression
        run: |
          set -euo pipefail
          python3 tools/test-native-config-spacing.py -v
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path("source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17")
          for name in ("warderNativeConfigSpacing.py", "warderLocale.py", "plugin.py"):
              ast.parse((root/name).read_text(),filename=name,feature_version=(3,9))
          print("PASS: receiver Python 3.9 syntax")
          PY
      - name: Stage independent version 1.0.88-test1 only from pre-release 1.0.87 sources
        id: stage
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '\r\n' < source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          if [ "$CURRENT" != "1.0.87" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Historical 1.0.88-test1 review build not applicable to stable source $CURRENT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          grep -qx 'Version: 1.0.87-1' source/control/control
          echo 1.0.88-test1 > source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version
          sed -i 's/^Version: 1\.0\.87-1$/Version: 1.0.88-test1-1/' source/control/control
          python3 tools/sync_header_version.py
          python3 tools/sync_header_version.py --check
      - name: Build only a self-contained IPK and verify embedded code
        if: steps.stage.outputs.build == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, io, subprocess, tarfile, tempfile
          from pathlib import Path
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location("warder_build",root/"tools/build-release-ipk.py")
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          output=root/"packages/test"
          output.mkdir(parents=True,exist_ok=True)
          package=output/"enigma2-plugin-skins-fullhdglass_1.0.88-test1_all.ipk"
          with tempfile.TemporaryDirectory() as tmp:
              work=Path(tmp)
              (work/"debian-binary").write_bytes(b"2.0\n")
              module.archive(root/"source/control",work/"control.tar.gz")
              module.archive(root/"source/package-root",work/"data.tar.gz",payload=True)
              subprocess.run(["ar","rcsD",str(package),"debian-binary","control.tar.gz","data.tar.gz"],cwd=work,check=True)
          assert package.is_file() and package.stat().st_size > 1_000_000
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(".ipk.sha256").write_text(digest+"  "+package.name+"\n")
          parts=subprocess.check_output(["ar","t",str(package)],text=True).splitlines()
          assert parts==["debian-binary","control.tar.gz","data.tar.gz"],parts
          control=subprocess.check_output(["ar","p",str(package),"control.tar.gz"])
          with tarfile.open(fileobj=io.BytesIO(control),mode="r:gz") as tar:
              metadata=tar.extractfile("./control").read().decode()
              assert "Version: 1.0.88-test1-1\n" in metadata
              assert "Package: enigma2-plugin-skins-fullhdglass-warder-evolution\n" in metadata
          payload=subprocess.check_output(["ar","p",str(package),"data.tar.gz"])
          with tarfile.open(fileobj=io.BytesIO(payload),mode="r:gz") as tar:
              prefix="./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/"
              assert tar.extractfile(prefix+"version").read().strip()==b"1.0.88-test1"
              mod=tar.extractfile(prefix+"warderNativeConfigSpacing.py").read()
              locale=tar.extractfile(prefix+"warderLocale.py").read()
              assert b"MIN_WIDE_CONFIG_WIDTH = 1200" in mod
              assert b"install_native_spacing()" in locale
          print("REVIEW IPK verified:",package.name,package.stat().st_size,digest)
          PY
          (cd packages/test && sha256sum -c enigma2-plugin-skins-fullhdglass_1.0.88-test1_all.ipk.sha256)
      - name: Upload isolated control IPK (not a Release, not an updater)
        if: steps.stage.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-1.0.88-test1-Czech-NativeConfig-REVIEW
          path: |
            packages/test/enigma2-plugin-skins-fullhdglass_1.0.88-test1_all.ipk
            packages/test/enigma2-plugin-skins-fullhdglass_1.0.88-test1_all.ipk.sha256
          if-no-files-found: error
          retention-days: 30
