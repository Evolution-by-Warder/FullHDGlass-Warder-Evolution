name: Repair exact CANAL SK CZ blank TV5MONDE production picons
on:
  push:
    branches: [repair/canal-tv5-transparent-20261117]
    paths:
      - .github/workflows/repair-canal-tv5-20261117.yml
permissions:
  contents: write
concurrency:
  group: warder-canal-tv5-exact-production-repair
  cancel-in-progress: false
jobs:
  verify-repair-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
            /.github/workflows/repair-canal-tv5-20261117.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet Pillow
      - name: Replace only the two blank 220x132 transparent TV5MONDE images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, io, json, pathlib, urllib.request, time, zipfile
          from PIL import Image
          R=pathlib.Path('assets/warder/downloads/picons/channels')
          M=R/'manifest.json'
          S=R/'SHA256SUMS'
          REF='1_0_1_1B03_3FE_1_C00000_0_0_0.png'
          REPO='Evolution-by-Warder/FullHDGlass-Warder-Evolution'
          RAW='https://raw.githubusercontent.com/'+REPO+'/main/assets/warder/downloads/picons/channels/'
          sha=lambda b: hashlib.sha256(b).hexdigest()
          def fetch(u):
              for i in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Warder-Canal-TV5-20261117','Cache-Control':'no-cache'}),timeout=100) as r:
                          assert r.status==200
                          return r.read()
                  except Exception:
                      if i==3: raise
                      time.sleep(2*(i+1))
          oldbytes=M.read_bytes()
          assert sha(fetch(RAW+'manifest.json'))==sha(oldbytes),'Production changed; retry new HEAD'
          m=json.loads(oldbytes)
          entries={(p['selector_id'],p['resolution'],p['family']):p for p in m['packages']}
          allparts={p['filename']:p for p in m['parts']}
          original_checks={}
          for line in S.read_text().splitlines():
              digest,sep,name=line.partition('  ')
              assert sep and len(digest)==64 and name not in original_checks
              original_checks[name]=digest
          assert original_checks['manifest.json']==sha(oldbytes)
          assert all(original_checks.get(p['filename'])==p['sha256'] for p in m['parts'])
          def archive(p):
              buffers=[]
              for url in p['parts']:
                  name=url.rsplit('/',1)[-1]
                  part=fetch(url)
                  info=allparts[name]
                  assert sha(part)==info['sha256'] and len(part)==info['bytes'],name
                  buffers.append(part)
              raw=b''.join(buffers)
              assert sha(raw)==p['sha256'] and len(raw)==p['bytes']
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
              return raw
          good_pngs=[]
          for selector in ('CANALPLUS_SK','CANALPLUS_CZ'):
              big=entries[(selector,'400x240','channel-transparent')]
              with zipfile.ZipFile(io.BytesIO(archive(big))) as z:
                  good=z.read(REF)
              with Image.open(io.BytesIO(good)) as im:
                  im.load()
                  rgba=im.convert('RGBA')
                  assert im.size==(400,240),'Unexpected high resolution'
                  assert rgba.getchannel('A').getbbox() is not None
                  assert len(rgba.getcolors(1000000) or [])>2
              good_pngs.append(good)
          assert sha(good_pngs[0])==sha(good_pngs[1]),'SK/CZ TV5 region source differs; hold'
          with Image.open(io.BytesIO(good_pngs[0])) as im:
              target=im.convert('RGBA').resize((220,132), Image.Resampling.LANCZOS)
          b=io.BytesIO()
          target.save(b,format='PNG',optimize=True,compress_level=9)
          new_png=b.getvalue()
          with Image.open(io.BytesIO(new_png)) as verify:
              verify.load()
              assert verify.size==(220,132) and verify.getchannel('A').getbbox() is not None
          report={'date':'2026-11-17','source':'Already published and identical CANALPLUS_SK/CZ 400x240 transparent same DVB reference',
                  'source_400_sha256':sha(good_pngs[0]),'new_220_sha256':sha(new_png),
                  'target':REF,'affected':[],'unchanged_archive_count':496,'ipk_changed':False}
          replaced_old_parts=[]
          for selector in ('CANALPLUS_SK','CANALPLUS_CZ'):
              package=entries[(selector,'220x132','channel-transparent')]
              oldzip=archive(package)
              new=io.BytesIO()
              replacements=0
              with zipfile.ZipFile(io.BytesIO(oldzip)) as zin, zipfile.ZipFile(new,'w') as zout:
                  for info in zin.infolist():
                      data=zin.read(info.filename)
                      if info.filename==REF:
                          with Image.open(io.BytesIO(data)) as current:
                              current.load()
                              assert current.size==(220,132)
                              assert current.convert('RGBA').getchannel('A').getbbox() is None, 'Not a confirmed blank; refuse overwrite'
                          data=new_png
                          replacements+=1
                      zout.writestr(info, data, compress_type=info.compress_type, compresslevel=9)
              assert replacements==1
              newzip=new.getvalue()
              with zipfile.ZipFile(io.BytesIO(oldzip)) as old, zipfile.ZipFile(io.BytesIO(newzip)) as updated:
                  assert old.namelist()==updated.namelist()
                  assert updated.testzip() is None
                  for name in old.namelist():
                      assert updated.read(name)==(new_png if name==REF else old.read(name)),name
                  assert len(old.namelist())==package['png_count']
              h=sha(newzip)
              new_name=package['filename'].rsplit('-',1)[0]+'-'+h[:16]+'.zip'
              partname=new_name+'.part00'
              assert partname not in allparts and not (R/partname).exists()
              (R/partname).write_bytes(newzip)
              m['parts'].append({'bytes':len(newzip),'filename':partname,'sha256':h})
              old_name=package['filename']
              replaced_old_parts.extend(url.rsplit('/',1)[-1] for url in package['parts'])
              package.update(filename=new_name,parts=[RAW+partname],sha256=h,bytes=len(newzip))
              report['affected'].append({'selector':selector,'from':old_name,'to':new_name,'archive_sha256':h,
                  'png_count':package['png_count'],'other_png_bytes_preserved':package['png_count']-1})
              print('REPAIRED',selector,'220x132 transparent',new_name,'preserved',package['png_count']-1,flush=True)
          assert len(report['affected'])==2 and len(replaced_old_parts)==2
          # Manifest metadata describes the active set only. Retired parts remain
          # physically on GitHub for safe in-flight downloads, but MUST NOT be listed
          # as unreferenced manifest entries.
          m['parts']=[p for p in m['parts'] if p['filename'] not in replaced_old_parts]
          for old_part in replaced_old_parts:
              assert original_checks.pop(old_part)==allparts[old_part]['sha256']
          assert len(m['packages'])==498 and len(m['parts'])==len(allparts)
          # Preserve all unchanged package references and all old content-addressed parts for safe in-flight downloads.
          new_manifest=(json.dumps(m,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode()
          M.write_bytes(new_manifest)
          original_checks['manifest.json']=sha(new_manifest)
          for item in report['affected']:
              part=item['to']+'.part00'
              original_checks[part]=item['archive_sha256']
          S.write_text(''.join(v+'  '+name+'\n' for name,v in
             [('manifest.json',original_checks['manifest.json'])]+sorted((n,h) for n,h in original_checks.items() if n!='manifest.json')))
          spec=importlib.util.spec_from_file_location('warder_picon_sync','source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py')
          sync=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sync)
          # Preserve the baseline runtime compatibility level. Historical
          # unrelated position packages may have legacy part names; a two-file
          # repair cannot silently rewrite those thousands of archived chunks.
          baseline_errors=sync.validate_publication_manifest(json.loads(oldbytes),RAW+'manifest.json')
          errors=sync.validate_publication_manifest(m,RAW+'manifest.json')
          print('BASELINE_RUNTIME_VALIDATION_ERRORS',len(baseline_errors),
                'AFTER',len(errors),flush=True)
          assert errors==baseline_errors, 'New validation errors: '+repr(errors[:20])
          assert sha(fetch(RAW+'manifest.json'))==sha(oldbytes),'Main publication changed while preparing changes'
          out=pathlib.Path('reports/canal-tv5-repair-20261117')
          out.mkdir(parents=True,exist_ok=True)
          report.update(status='SOURCE_VERIFIED_PRODUCTION_PACKAGE_REPAIR_READY',
                        manifest_before_sha256=sha(oldbytes),manifest_after_sha256=sha(new_manifest),
                        parts_replaced=2,retired_part_files_preserved=True,live_runtime_manifest_test='NO_NEW_ERRORS',
                        unchanged_archive_data_preserved=True)
          (out/'verification.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          target.save(out/'tv5-preview.png')
          print('VERIFIED TWO REPAIRS; no other package changed',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-canal-tv5-repair-20261117
          path: |
            reports/canal-tv5-repair-20261117/verification.json
            reports/canal-tv5-repair-20261117/tv5-preview.png
          retention-days: 30
      - name: Publish ONLY new content-addressed parts and updated production manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Warder verified CANAL picon publisher"
          git config user.email "warder-picons@users.noreply.github.com"
          git add --sparse assets/warder/downloads/picons/channels/manifest.json assets/warder/downloads/picons/channels/SHA256SUMS
          git add --sparse assets/warder/downloads/picons/channels/warder-canalplus_sk-220x132-transparent-*.zip.part00
          git add --sparse assets/warder/downloads/picons/channels/warder-canalplus_cz-220x132-transparent-*.zip.part00
          git add --sparse reports/canal-tv5-repair-20261117/verification.json
          git diff --cached --check
          git commit -m "Fix blank CANAL+ SK/CZ 220x132 TV5MONDE in exact production archives"
          FIX_COMMIT="$(git rev-parse HEAD)"
          git fetch origin main
          git switch -C canal-tv5-publish origin/main
          git cherry-pick "$FIX_COMMIT"
          git push origin HEAD:main
          echo "Published production data commit $(git rev-parse HEAD); no IPK and no version bump."
