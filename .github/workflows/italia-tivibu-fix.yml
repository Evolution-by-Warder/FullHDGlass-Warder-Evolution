name: Italia Tivibu corrected provider and donor inventory
on:
  push:
    branches: [work/italia-final-41-20261124]
    paths: ['reports/italia-final-41-20261124/tivibu-fix.py', '.github/workflows/italia-tivibu-fix.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: reports/italia-final-41-20261124
      - uses: actions/checkout@v4
        with:
          ref: 1c9e1bfc3e669e2e3a8ecb1e780172e68e210d3a
          path: production
          fetch-depth: 1
          sparse-checkout: |
            assets/warder/downloads/picons/providers
            assets/warder/downloads.json
            assets/warder/downloads/picons/channels/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python reports/italia-final-41-20261124/tivibu-fix.py production
      - name: Commit only targeted correction to publication branch
        run: |
          cd production
          test "$(git rev-parse HEAD)" = "1c9e1bfc3e669e2e3a8ecb1e780172e68e210d3a"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers/{black,white,transparent}/piconProv.zip reports/italia-tivibu-fix-20261125
          git diff --cached --stat
          git commit -m "Correct Tivibu provider identity using exact approved Turkish donor"
          git push origin HEAD:refs/heads/publish/italia-tivibu-20261125
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: italia-tivibu-and-donor-review
          path: |
            donor-review/
            production/reports/italia-tivibu-fix-20261125/
