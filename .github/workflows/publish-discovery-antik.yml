name: Publish approved Discovery Channel picons for AntikSAT and 16E
on:
  push:
    branches: [picons/discovery-antik-20261022]
    paths: [.github/workflows/publish-discovery-antik.yml, tools/publish-discovery-antik.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/picons/discovery-antik-20261022'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /update.json
            /update-test.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: 2d5b1ec8d37742825bb5571508c856d919590377
          path: .approved-picons
          sparse-checkout: |
            picons/16.0e/antiksat
            migration/discovery-235e-to-antik-20261022
      - name: Copy existing artwork and verify native AntikSAT and 16E installation
        run: |
          python3 tools/publish-discovery-antik.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/discovery-235e-to-antik-20261022.json
          git commit -m 'Replace Discovery Channel picons for AntikSAT and 16E; preserve IPK 1.0.13'
          git push origin HEAD:refs/heads/picons/discovery-antik-20261022
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-antik-data-only-verification
          path: reports/discovery-235e-to-antik-20261022.json
