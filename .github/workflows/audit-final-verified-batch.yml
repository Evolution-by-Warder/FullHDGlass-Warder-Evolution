name: Independently verify 142 live provider variants
on:
  push:
    branches: [audit/italia-final-verified-batch-20261124]
    paths: ['.github/workflows/audit-final-verified-batch.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import hashlib,io,json,struct,urllib.request,zipfile
          R='https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/'
          B=R+'286291aaac56f78015c7d147bcafc4ade8604a6c/';F=R+'main/'
          def get(u):
              with urllib.request.urlopen(u,timeout=60) as r:return r.read()
          def sha(b):return hashlib.sha256(b).hexdigest()
          cat=json.loads(get(F+'assets/warder/downloads.json'));assets=cat.get('assets',cat)
          expected=set(json.loads(get(F+'reports/italia-final-verified-batch-20261124/build.json'))['names']);assert len(expected)==70
          for style,key,count,add,digest in [
              ('transparent','piconProv-220',1367,70,'2488b8b4e1befc7606487d0db7e41cf655f77a19320ec71c49af225fe08fc386'),
              ('white','piconProv-w',1387,41,'491ff2a8d28c3e6fe06f6eb426a83617794b0574c9593b7392bfb4e788fb19c2'),
              ('black','piconProv-b',1402,31,'6bba8b5bf63f5b27e5e506e45b2320f74a2395bdc4c225b8d07bfdcbb97f7a10')]:
              path='assets/warder/downloads/picons/providers/'+style+'/piconProv.zip'
              raw=get(F+path);old=get(B+path);assert sha(raw)==digest==assets[key]['sha256']
              assert len(raw)==assets[key]['size'] and assets[key]['png_count']==count
              with zipfile.ZipFile(io.BytesIO(raw)) as z,zipfile.ZipFile(io.BytesIO(old)) as a:
                  assert z.testzip() is None and len(z.namelist())==count and len(set(z.namelist()))==count
                  assert all(z.read(n)==a.read(n) for n in a.namelist())
                  assert len(set(z.namelist())-set(a.namelist()))==add
                  assert {'piconProv/'+n for n in expected}<=set(z.namelist())
                  for n in z.namelist():
                      b=z.read(n);assert b[:8]==bytes.fromhex('89504e470d0a1a0a') and struct.unpack('>II',b[16:24])==(220,132)
              print(style,count,'PASS, original PNGs preserved',flush=True)
          m=get(F+'assets/warder/downloads/picons/channels/manifest.json')
          assert sha(m)=='4541dea07b011d2cac2981c5b8203ebae7e363c85e481316a4cf6c0b04d9b6a6'
          assert m==get('https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/main/plugin/src/Plugins/Extensions/WarderPiconHub/data/channel-manifest.json')
          print('PASS: 3/3 live provider ZIPs, all 70 names complete, identical DTT manifests')
          PY
