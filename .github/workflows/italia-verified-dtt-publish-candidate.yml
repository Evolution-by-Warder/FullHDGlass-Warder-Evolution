name: Verified Italia DTT additive publication candidate
on:
  push:
    branches: [work/italia-final-41-20261124]
    paths: ['reports/italia-final-41-20261124/approved-dtt-delta.zip']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: reports/italia-final-41-20261124
      - uses: actions/checkout@v4
        with:
          ref: a568467cc3fc05dae0c3c00bca9c3a6c56e0dd64
          path: production
          fetch-depth: 1
          sparse-checkout: |
            assets/warder/downloads/picons/channels/manifest.json
            assets/warder/downloads/picons/channels/SHA256SUMS
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Verify current main and exact owner-approved payload
        run: |
          test "$(git -C production rev-parse HEAD)" = a568467cc3fc05dae0c3c00bca9c3a6c56e0dd64
          test "$(git -C production ls-remote origin refs/heads/main | cut -f1)" = a568467cc3fc05dae0c3c00bca9c3a6c56e0dd64
          echo '5fb0217df0d7e73c931092e858faa2f37c73aeb01632ece28f3c99e805822846  reports/italia-final-41-20261124/approved-dtt-delta.zip' | sha256sum --check
      - name: Build and verify additive nine-archive candidate
        run: python reports/italia-final-41-20261124/publish-dtt-verified.py production reports/italia-final-41-20261124/approved-dtt-delta.zip
      - name: Commit only verified new production assets to a separate branch
        run: |
          cd production
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = a568467cc3fc05dae0c3c00bca9c3a6c56e0dd64
          test -z "$(git ls-remote origin refs/heads/publish/italia-dtt-verified-20261125)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- assets/warder/downloads/picons/channels/manifest.json assets/warder/downloads/picons/channels/SHA256SUMS reports/italia-dtt-verified-20261125/build.json
          python -c 'import json; print("\\n".join("assets/warder/downloads/picons/channels/"+n for n in json.load(open("reports/italia-dtt-verified-20261125/build.json"))["new_parts"]))' | while IFS= read -r file; do git add --sparse -- "$file"; done
          git diff --cached --stat
          git commit -m "Add 54 approved DTT Italia PNGs without changing existing artwork"
          git push origin HEAD:refs/heads/publish/italia-dtt-verified-20261125
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: italia-dtt-verified-build-proof
          path: production/reports/italia-dtt-verified-20261125/build.json
          if-no-files-found: warn
