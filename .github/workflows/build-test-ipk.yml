name: Build Warder TEST IPK

on:
  workflow_dispatch:
  push:
    branches:
      - warder-modernization-work
    paths:
      - .github/TEST-BUILD-REQUEST

permissions:
  contents: write

jobs:
  build-test-ipk:
    if: github.ref == 'refs/heads/warder-modernization-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install gettext compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext ffmpeg python3-pil

      - name: Static package preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^Package:[[:space:]]*//p' source/control/control | head -n1)" = "enigma2-skin-fullhdglass17"
          grep -Eq '^Version: [0-9]+[.][0-9]+[.][0-9]+-test[0-9]+-[0-9]+$' source/control/control
          grep -Eq -- '-test' source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version
          RADIO_MASTER="source/package-root/usr/share/enigma2/hd_glass17/warder-radio-background.jpg"
          test -f "$RADIO_MASTER"
          echo "2d758e0cb7a989ea78f8fb7ec85459d307a2f73e7af202a5b5f85005dea19d23  $RADIO_MASTER" | sha256sum -c -
          test "$(cat update.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "1.0.4"
          ! find source/package-root -type d -name __pycache__ -print -quit | grep -q .
          ! find source/package-root -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          python3 -m compileall -q -f source/package-root/usr/lib/enigma2/python
          find source/package-root -type d -name __pycache__ -prune -exec rm -rf {} +
          find source/package-root -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("source/package-root").rglob("*.xml"):
              if p.name == "hdg17Screens.xml":
                  # Intentional Enigma2 fragment with multiple top-level screen nodes.
                  ET.fromstring("<skin>\\n" + p.read_text(encoding="utf-8") + "\\n</skin>")
              else:
                  ET.parse(p)
          print("XML parse gate: PASS")
          PY
          bash -n source/control/preinst source/control/postinst source/control/postrm tools/build-test-ipk.sh tools/test-package-lifecycle.sh
          chmod +x tools/test-package-lifecycle.sh tools/test-runtime-safety.py
          ./tools/test-package-lifecycle.sh
          python3 tools/test-runtime-safety.py
          python3 tools/test-version-order.py
          python3 tools/test-r12-regressions.py
          python3 tools/validate-legacy-ftp-migration.py
          python3 tools/audit-runtime-network-dependencies.py
          python3 tools/validate-channel-picon-cutover.py
          python3 tools/validate-channel-picon-publication-plan.py
          python3 tools/validate-channel-picon-two-phase-cutover.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("assets/warder/channel-picon-build.json").read_text())
          assert b["runtime_cutover"] is False
          assert b["publication"]["state"]=="NOT_PUBLISHED"
          assert b["publication"]["persistent"] is False
          assert b["publication"]["manifest_url"] is None
          assert b["publication"]["base_url"] is None
          assert b["publication"]["required_packages"]==114
          print("Channel-picon publication lock: PASS")
          PY
          git diff --exit-code -- assets/warder/runtime-network-dependencies.json
          python3 tools/generate-picon-package-plan.py --output /tmp/picon-package-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("/tmp/picon-package-plan.json").read_text(encoding="utf-8"))
          selectors = plan["selectors"]
          assert len(selectors) == 57, len(selectors)
          ready = [x for x in selectors if x["state"] == "READY"]
          missing = [x for x in selectors if x["state"] == "MISSING_SOURCE"]
          blocked = [x for x in selectors if x["state"] == "BLOCKED"]
          assert len(ready) == 38, len(ready)
          assert len(missing) == 17, len(missing)
          assert {x["selector_id"] for x in blocked} == {"08W", "160E"}
          assert all(set(x["eligible_families"]) == {"channel-transparent", "channel-black", "channel-white"} for x in ready)
          assert all(not x["eligible_families"] for x in blocked)
          print("Picon migration plan gate: PASS (38 ready / 2 collision-blocked / 17 missing)")
          PY
          python3 tools/test-picon-materializer.py

      - name: Build TEST IPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build-test-ipk.sh
          ./tools/build-test-ipk.sh

      - name: Inspect built package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(sed -n 's/^Version:[[:space:]]*//p' source/control/control | head -n1)"
          RUNTIME_VERSION="$(tr -d '\r\n' < source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          IPK="packages/test/enigma2-skin-fullhdglass17-warder-evolution_${RUNTIME_VERSION}_all.ipk"
          test -f "$IPK"
          chmod +x tools/verify-test-ipk.sh
          ./tools/verify-test-ipk.sh "$IPK" "$RUNTIME_VERSION" "$PACKAGE_VERSION"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          (cd "$TMP" && ar x "$GITHUB_WORKSPACE/$IPK")
          tar -tzf "$TMP/data.tar.gz" > packages/test/PAYLOAD-LIST.txt

      - name: Publish TEST package for receiver updater
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(sed -n 's/^Version:[[:space:]]*//p' source/control/control | head -n1)"
          VERSION="$(tr -d '\r\n' < source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          test "$PACKAGE_VERSION" = "$VERSION-1"
          IPK="packages/test/enigma2-skin-fullhdglass17-warder-evolution_${VERSION}_all.ipk"
          test -f "$IPK"
          SHA="$(sha256sum "$IPK" | awk '{print $1}')"
          NAME="$(basename "$IPK")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p packages/test
          printf '%s  %s\n' "$SHA" "$NAME" > "packages/test/$NAME.sha256"
          python3 - "$VERSION" "$NAME" "$SHA" <<'PY'
          import json, sys
          version, name, sha = sys.argv[1:]
          data = {
              "version": version,
              "package_url": "https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/warder-modernization-work/packages/test/" + name,
              "sha256": sha,
              "changelog": "FullHDGlass17 - Warder Evolution TEST: current verified development build."
          }
          with open("update-test.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY
          git add -f "packages/test/$NAME" "packages/test/$NAME.sha256"
          git add update-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified TEST package $VERSION [skip ci]"
            git push origin HEAD:warder-modernization-work
          fi

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: fullhdglass17-warder-evolution-TEST
          path: |
            packages/test/*.ipk
            packages/test/*.sha256
            packages/test/PAYLOAD-LIST.txt
          if-no-files-found: error
          retention-days: 14
