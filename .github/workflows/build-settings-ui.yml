name: Build Warder settings UI TEST
on:
  push:
    branches: [warder-modernization-work]
    paths:
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderHelpArt.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warder-help-masks.json
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/images/warder-settings-background.png
      - design/settings-header-asset.json
      - tools/test-help-art.py
      - tools/test-help-preview.py
      - tools/build-help-previews.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderHelpPreview.py
      - source/package-root/usr/lib/enigma2/python/Components/Renderer/WarderSettingsCanvas.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderDialogs.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderDialogSkins.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderTools.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderUiText.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/history.txt
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/history.txtSk
      - source/package-root/usr/lib/enigma2/python/Components/g17ConfigList.py
      - design/settings-batch261-logic.json
      - design/settings-batch261-assets.json
      - tools/optimize-png.py
      - tools/test-settings-batch.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderTypePreviews.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warder-infobar-types.zip
      - tools/build-type-previews.py
      - tools/build-help-previews.py
      - tools/test-help-art.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPreviewAssets.py
      - source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/preview-assets.json
      - tools/test-settings-publisher.py
      - tools/publish-settings-update.py
      - design/live-update.json
      - tools/test-preview-assets.py
      - tools/verify-preview-release-assets.py
      - design/preview-assets/**
      - source/control/control
      - tools/style-setup-screens.py
      - tools/test-setup-style.py
      - tools/build-setup-style-test.py
      - tools/verify-setup-style-ipk.py
      - tools/fixtures/setup-ui-1.0.15.json
      - .github/workflows/build-settings-ui.yml
permissions:
  contents: read
concurrency:
  group: warder-settings-test
  cancel-in-progress: false
jobs:
  settings-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            docs
            design
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Validate settings controllers and layouts
        run: |
          python3 tools/test-setup-style.py -v
          python3 tools/test-help-preview.py -v
          python3 tools/test-runtime-safety.py
          python3 tools/test-settings-publisher.py -v
          python3 tools/test-version-order.py
          python3 tools/verify-radio-release.py
      - name: Verify all 252 original help illustrations and background filtering
        run: |
          python3 -m pip install --quiet Pillow
          curl --fail --location --silent --show-error -o /tmp/warder-help.zip https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/main/assets/warder/downloads/ui/help/g17_setup_pict.zip
          python3 tools/test-settings-batch.py -v
          python3 tools/build-help-previews.py --bundle /tmp/warder-help.zip --output /tmp/warder-help-previews.zip
          python3 tools/test-preview-assets.py -v
          python3 tools/verify-preview-release-assets.py --help-previews /tmp/warder-help-previews.zip
          python3 tools/test-help-art.py --bundle /tmp/warder-help.zip --prebuilt /tmp/warder-help-previews.zip
      - name: Validate existing gettext catalogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          find source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/locale -name '*.po' -print0 | xargs -0 -I '{}' msgfmt --check -o /dev/null '{}'
      - name: Build isolated TEST package and verify every payload byte
        run: |
          python3 tools/build-setup-style-test.py --help-previews /tmp/warder-help-previews.zip
          python3 tools/verify-setup-style-ipk.py --help-previews /tmp/warder-help-previews.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-settings-TEST264
          path: packages/test/*
          retention-days: 90
      - name: Publish package and activate explicitly approved updater version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)
          TAG="settings-ui-${VERSION}"
          PACKAGE="packages/test/enigma2-skin-fullhdglass-warder-evolution_${VERSION}_all.ipk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/warder-published-ui
            gh release download "$TAG" --pattern '*.ipk' --dir /tmp/warder-published-ui
            cmp "$PACKAGE" "/tmp/warder-published-ui/$(basename "$PACKAGE")"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "FullHDGlass Warder Evolution — nastavenia TEST264" \
              --notes-file docs/SETTINGS-UI-TEST264.md \
              "$PACKAGE" "$PACKAGE.sha256" packages/test/settings-ui-build.json \
              /tmp/warder-help-previews.zip design/preview-assets/warder-infobar-types.zip
          fi
          gh release upload "$TAG" /tmp/warder-help-previews.zip design/preview-assets/warder-infobar-types.zip --clobber
          python3 tools/publish-settings-update.py --package "$PACKAGE" --build-info packages/test/settings-ui-build.json --revision "$GITHUB_SHA"
