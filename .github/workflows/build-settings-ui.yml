permissions:
  contents: read
concurrency:
  group: warder-settings-test
  cancel-in-progress: true
jobs:
  settings-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            docs
            design
            .github
            assets/warder/downloads/ui/icon-set-previews
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install radio verification dependencies
        run: |
          python3 -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Validate settings controllers and layouts
        run: |
          python3 tools/check-auxiliary-layout.py
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 2 -o /tmp/warder-keyboard-pinned.py https://raw.githubusercontent.com/openatv/enigma2/830a20471cb3bc2ddc4f61b5e02348c71059f575/lib/python/Screens/VirtualKeyBoard.py
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 2 -o /tmp/warder-keyboard-latest.py https://raw.githubusercontent.com/openatv/enigma2/master/lib/python/Screens/VirtualKeyBoard.py
          python3 tools/test-virtual-keyboard.py --upstream /tmp/warder-keyboard-pinned.py --latest /tmp/warder-keyboard-latest.py -v
          python3 tools/test-skin-package-retention.py -v
          python3 tools/test-radio-spectrum.py -v
          python3 tools/test-runtime-cleanup.py -v
          python3 tools/test-radio-background.py -v
          python3 tools/test-radio-lyrics.py -v
          python3 tools/test-setup-style.py -v
          python3 tools/test-help-preview.py -v
          python3 tools/test-startup-update.py -q
          python3 tools/test-radio-weekly-update.py -v
          python3 tools/test-dab-shared-runtime.py -v
          python3 tools/test-iptv-shared-runtime.py -v
          python3 tools/test-radio-picon.py -v
          python3 tools/test-radio-stream-metadata.py -v
          python3 tools/test-runtime-safety.py
          python3 tools/test-settings-publisher.py -v
          python3 tools/test-native-skin-publisher.py -v
          python3 tools/test-settings-glass.py -v
          python3 tools/test-version-order.py
          python3 tools/test-package-transition.py -v
          python3 tools/test-package-transition-publisher.py -v
          python3 tools/verify-radio-release.py
      - name: Verify canonical optional archives and preview behaviour
        run: |
          REUSE=$(python3 -c 'import json; print(str(json.load(open("design/live-update.json")).get("reuse_verified_preview_archives",False)).lower())')
          if [ "$REUSE" = true ]; then
            curl --fail --location --silent --show-error -o /tmp/g17_setup_pict.zip https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/main/assets/warder/downloads/ui/help/g17_setup_pict.zip
            python3 tools/test-settings-batch.py -v
            python3 tools/test-preview-assets.py -v
            python3 tools/verify-preview-release-assets.py --help-previews /tmp/g17_setup_pict.zip
          else
            python3 -m pip install --quiet Pillow
            curl --fail --location --silent --show-error -o /tmp/warder-help.zip https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/81ff0fb83709344d696c73ed70530ef09651916b/assets/warder/downloads/ui/help/g17_setup_pict.zip
            python3 tools/test-settings-batch.py -v
            python3 tools/build-canonical-picons.py
            python3 tools/test-canonical-picons.py --built-dir /tmp/warder-canonical-picons -q
            python3 tools/test-auxiliary-hybrid-runtime.py
            python3 tools/build-help-previews.py --bundle /tmp/warder-help.zip --output /tmp/g17_setup_pict.zip
            python3 tools/test-preview-assets.py -v
            python3 tools/verify-preview-release-assets.py --help-previews /tmp/g17_setup_pict.zip
            python3 tools/test-help-art.py --bundle /tmp/warder-help.zip --prebuilt /tmp/g17_setup_pict.zip
          fi
      - name: Validate existing gettext catalogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext ffmpeg
          find source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/locale -name '*.po' -print0 | xargs -0 -I '{}' msgfmt --check -o /dev/null '{}'
      - name: Verify live exact-song lookup without publishing lyrics
        run: |
          python3 tools/check-radio-lyrics-provider.py
          python3 tools/check-radio-lyrics-provider.py --karaoke --allow-unavailable
          python3 tools/check-radio-lyrics-provider.py --kytary --allow-unavailable
          python3 tools/check-radio-lyrics-provider.py --supermusic
      - name: Build numbered package and verify every payload byte
        run: |
          python3 tools/build-setup-style-test.py --help-previews /tmp/g17_setup_pict.zip
          python3 tools/verify-setup-style-ipk.py --help-previews /tmp/g17_setup_pict.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-settings-release
          path: packages/test/*
          retention-days: 90
      - name: Publish package and activate explicitly approved updater version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/warder-modernization-work" --jq .object.sha)
          if [[ "$CURRENT" != "$GITHUB_SHA" ]]; then
            echo "Source advanced; skipping superseded release."
            exit 0
          fi
          VERSION=$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)
          PACKAGE="packages/test/enigma2-plugin-skins-fullhdglass_${VERSION}_all.ipk"
          DOWNLOAD="packages/test/enigma2-plugin-skins-fullhdglass_${VERSION}_all.ipk"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/warder-verified-release
            gh release download "$TAG" --pattern "$(basename "$PACKAGE")" --dir /tmp/warder-verified-release
            cmp "$PACKAGE" "/tmp/warder-verified-release/$(basename "$PACKAGE")"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "FullHDGlass Warder Evolution ${VERSION}" \
              --notes-file docs/CURRENT-RELEASE.md "$DOWNLOAD" "$DOWNLOAD.sha256"
          fi
          python3 tools/publish-native-skin.py --revision "$GITHUB_SHA" --preserve-picon-assets
      - name: Keep current, previous and active migration packages only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/prune-stale-skin-packages.py
