name: FullHDGlass stable release preflight from runtime version (no publication)
on:
  pull_request:
    paths:
      - 'source/**'
      - 'docs/warder-*'
      - 'tools/**'
      - '.github/workflows/fullhdglass-stable-1.0.82-preflight.yml'
permissions:
  contents: read
jobs:
  verify-stable-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /design/
            /docs/
            /reports/
            /update-production.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce release source, version and unchanged SAT assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "WARDER_VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -qx "Version: $VERSION-1" source/control/control
          test "$(git hash-object assets/warder/downloads/picons/channels/manifest.json)" = 1c1b8d2ca04fce316ca8104be4228df55c0d61e5
          test "$(git hash-object assets/warder/downloads/picons/channels/SHA256SUMS)" = 64adc4941304762727589d498787befe122eac4e
          test -s "docs/warder-$VERSION-release-notes.md"
          test -s "docs/warder-$VERSION-update-text.json"
          python3 tools/sync_header_version.py --check
          for part in preinst postinst postrm prerm; do sh -n source/control/"$part"; done
          python3 tools/test_iptv_infobar_service_name.py -q
          python3 tools/test_warder_integrated_skin.py -q
          python3 tools/test-radio-bundle-fetch.py -q
          python3 tools/test-radio-approved-country-installer.py -q
          python3 tools/test-radio-production-feed-1.0.83.py -q
      - name: Materialize pinned bitrate verification reports and build stable IPK offline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('tools').resolve()))
          from bitrate_package import validate_helpers
          proof=json.loads(Path('reports/bitrate-test5-20261101.json').read_text())
          out=Path('packages/test')
          out.mkdir(parents=True,exist_ok=True)
          assert len(proof['builds'])==3
          for name,report in zip(('arm','mipsel','aarch64'),proof['builds']):
              filename='bitrate-helper-build.json' if name=='arm' else 'bitrate-helper-'+name+'-build.json'
              (out/filename).write_text(json.dumps(report,indent=2)+'\n')
          validate_helpers(Path.cwd())
          PY
          python3 tools/build-release-ipk.py
          (cd packages && sha256sum -c "enigma2-plugin-skins-fullhdglass_${WARDER_VERSION}_all.ipk.sha256")
      - name: Check real package metadata and key included fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,tarfile,io,os
          version=os.environ['WARDER_VERSION']
          p=Path('packages/enigma2-plugin-skins-fullhdglass_'+version+'_all.ipk')
          assert p.stat().st_size < 22*1024*1024
          assert subprocess.check_output(['ar','t',str(p)],text=True).splitlines()==['debian-binary','control.tar.gz','data.tar.gz']
          def open_tar(name):
              data=subprocess.check_output(['ar','p',str(p),name])
              return tarfile.open(fileobj=io.BytesIO(data),mode='r:gz')
          with open_tar('control.tar.gz') as t:
              control=t.extractfile('./control').read()
              assert ('Version: '+version+'-1').encode() in control
          with open_tar('data.tar.gz') as t:
              names={m.name for m in t.getmembers()}
              plug='./usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/'
              conv='./usr/lib/enigma2/python/Components/Converter/g17ServiceNum.py'
              assert t.extractfile(plug+'version').read().strip()==version.encode()
              assert b'current_ref.getName()' in t.extractfile(conv).read()
              assert b'cached_country_picon' in t.extractfile(plug+'screenSaver.py').read()
              assert b'radioSaverDelay' in t.extractfile(plug+'plugin.py').read()
              assert not any('radio-countries-bouquets.zip' in n for n in names)
              icons=[n for n in names if n.startswith('./usr/share/enigma2/hd_glass17/icons_factory/') and n.endswith('.png')]
              assert len(icons)==148,len(icons)
              print('Stable '+version+' preflight package verified:',p.stat().st_size,'bytes',len(names),'members')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-current-stable-preflight-not-published
          path: |
            packages/enigma2-plugin-skins-fullhdglass_${{ env.WARDER_VERSION }}_all.ipk
            packages/enigma2-plugin-skins-fullhdglass_${{ env.WARDER_VERSION }}_all.ipk.sha256
          retention-days: 30
          if-no-files-found: error
