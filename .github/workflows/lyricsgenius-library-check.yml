name: Check real LyricsGenius library access
on:
  workflow_dispatch:
  push:
    branches: [feature/radio-lyrics-layout]
    paths:
      - diagnostics/check-lyricsgenius.py
      - .github/workflows/lyricsgenius-library-check.yml
permissions:
  contents: read
jobs:
  library-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch only the diagnostic at this exact commit
        env:
          DIAGNOSTIC_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/diagnostics/check-lyricsgenius.py
        run: curl --fail --location --max-time 20 --output /tmp/check-lyricsgenius.py "$DIAGNOSTIC_URL"
      - run: python3 -m pip install --disable-pip-version-check --quiet --retries 0 --timeout 15 lyricsgenius
      - run: python3 /tmp/check-lyricsgenius.py
