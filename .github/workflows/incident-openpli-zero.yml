name: Skutočná obnova OPKG na OpenPLi 9.2 VU Zero
on:
  push:
    branches: [podpis/stabilne-vydanie-20261127]
    paths: ['tools/incident-fullhdglass/**', '.github/workflows/incident-openpli-zero.yml']
permissions: {contents: read}
jobs:
  obnova:
    if: github.repository == 'Evolution-by-Warder/FullHDGlass-Warder-Evolution' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, sparse-checkout: 'tools/incident-fullhdglass'}
      - name: Pripraviť izolovanú emuláciu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support bubblewrap python3-venv
          sudo update-binfmts --enable qemu-mipsel
          python3 -m venv "$RUNNER_TEMP/firmware-tools"
          "$RUNNER_TEMP/firmware-tools/bin/pip" install ubi-reader jefferson
      - run: python3 -B tools/incident-fullhdglass/runner.py
