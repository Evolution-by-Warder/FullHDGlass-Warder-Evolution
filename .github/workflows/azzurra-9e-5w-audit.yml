name: Audit Azzurra SAT 9E 5W (read only)
on:
  push:
    branches: [work/azzurra-9e-5w-20261125]
    paths: ['.github/workflows/azzurra-9e-5w-audit.yml','reports/azzurra-9e-5w-20261125/audit.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: reports/azzurra-9e-5w-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python reports/azzurra-9e-5w-20261125/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: azzurra-production-audit
          path: audit-output/
          if-no-files-found: error
