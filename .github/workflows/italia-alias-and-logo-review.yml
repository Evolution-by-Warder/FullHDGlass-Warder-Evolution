name: Italian historic aliases and further clean logo review
on:
  push:
    branches: [work/italia-alias-and-logo-review-20261124]
    paths: ['.github/workflows/italia-alias-and-logo-review.yml', 'reports/italia-alias-and-logo-review-20261124/*']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reports/italia-alias-and-logo-review-20261124/
      - run: python -m pip install --quiet Pillow cairosvg
      - run: python reports/italia-alias-and-logo-review-20261124/build-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: italian-additional-logo-review
          path: vector-review/
  aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-alias-and-logo-review-20261124/*
            /assets/warder/downloads.json
            /assets/warder/downloads/picons/providers/transparent/piconProv.zip
            /assets/warder/downloads/picons/providers/white/piconProv.zip
            /assets/warder/downloads/picons/providers/black/piconProv.zip
      - run: python reports/italia-alias-and-logo-review-20261124/build-aliases.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads.json assets/warder/downloads/picons/providers/transparent/piconProv.zip reports/italia-alias-and-logo-review-20261124/alias-build.json
          git commit -m "Complete five historical Viasat aliases with byte-matched approved donor"
          git push origin HEAD:work/italia-alias-and-logo-review-20261124
