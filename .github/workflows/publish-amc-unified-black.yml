name: Publish approved uniform AMC black picons without IPK
on:
  push:
    branches: [picons/amc-unified-black-20261022]
    paths: [.github/workflows/publish-amc-unified-black.yml, tools/publish-amc-unified-black.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/picons/amc-unified-black-20261022'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /update.json
            /update-test.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: a1858a7d5233fa6bf3de5b51394596a98aa645a9
          path: .approved-picons
          sparse-checkout: |
            picons/23.5e/canal-plus-sk/black
            picons/23.5e/canal-plus-cz/black
            picons/23.5e/skylink/black
            picons/23.5e/m7-group/black
            migration/amc-unified-black-20261022
      - name: Unify AMC archives and verify replacement without IPK update
        run: |
          python3 tools/publish-amc-unified-black.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/amc-unified-black-approved-20261022.json
          git commit -m 'Unify all AMC black picons in Canal+ SK/CZ and 23.5E; preserve IPK 1.0.13'
          git push origin HEAD:refs/heads/picons/amc-unified-black-20261022
      - uses: actions/upload-artifact@v4
        with:
          name: amc-unified-black-data-only-verification
          path: reports/amc-unified-black-approved-20261022.json
