name: Probe public lyric source access
on:
  push:
    branches: [feature/radio-lyrics-layout]
    paths: [.github/workflows/lyricfind-access-probe.yml]
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Read public source structure without publishing lyrics
        run: |
          python - <<'PY'
          import json,re,hashlib
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          from collections import Counter
          class Page(HTMLParser):
           def __init__(self):
            super().__init__();self.classes=Counter();self.heads=[];self.current=None;self.scripts=[];self.forms=[];self.inputs=[];self.links=[]
           def handle_starttag(self,t,attrs):
            d=dict(attrs);self.classes.update(d.get('class','').split())
            if t in ('h1','h2') and len(self.heads)<2:self.current=[]
            if t=='script' and d.get('src'):self.scripts.append(d['src'].split('?')[0])
            if t=='form':self.forms.append({k:d[k] for k in ('action','method') if k in d})
            if t=='input':self.inputs.append({k:d[k] for k in ('type','name','placeholder') if k in d})
            if t=='a' and any(v in d.get('href','') for v in ('search','lyrics/')) and len(self.links)<8:self.links.append(d['href'])
           def handle_endtag(self,t):
            if t in ('h1','h2') and self.current is not None:
             self.heads.append(' '.join(''.join(self.current).split())[:100]);self.current=None
           def handle_data(self,s):
            if self.current is not None:self.current.append(s)
          for url in ('https://lyrics.lyricfind.com/','https://lyrics.lyricfind.com/lyrics/adele-someone-like-you-2','https://www.supermusic.sk/piesen.php?idpiesne=330895'):
           row={'url':url}
           try:
            try:
             response=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'}),timeout=15)
            except HTTPError as error:response=error
            with response as f:
             raw=f.read(1048577);row.update(status=f.status,final_url=f.geturl(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
            page=Page();page.feed(raw.decode('utf-8','replace'));row.update(headings=page.heads,classes=page.classes.most_common(20),scripts=page.scripts[:8],forms=page.forms[:4],inputs=page.inputs[:8],links=page.links,has_next_data='__NEXT_DATA__' in raw.decode('utf-8','replace'),has_nuxt='__NUXT__' in raw.decode('utf-8','replace'))
           except Exception as error:row.update(error=type(error).__name__)
           print('SOURCE_PROBE '+json.dumps(row,ensure_ascii=False),flush=True)
          PY
