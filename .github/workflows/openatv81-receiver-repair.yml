name: FullHDGlass LCD4linux footer test 1.0.58-test1
on:
  push:
    branches: [fix/lcd4linux-footer-20261101]
    paths: [source/**, tools/**, docs/LCD4LINUX-FOOTER-1.0.58-test1.md, .github/workflows/openatv81-receiver-repair.yml]
permissions:
  contents: read
concurrency:
  group: fullhdglass-lcd4linux-footer
  cancel-in-progress: true
jobs:
  openatv:
    uses: ./.github/workflows/verify-system-screen-compatibility.yml
  release:
    needs: openatv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            tools
            design
            docs
            reports
            assets/warder/downloads/ui/spinners
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build dependencies
        run: |
          python -m pip install --quiet Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Verify real catalog, native selection, paging, sizing and existing behavior
        run: |
          python tools/test-config-font-compat.py -q
          python tools/test-history-radio-header.py -q
          python tools/test-lcd4linux-footer.py -q
          python tools/test-bitrate-runtime.py -q
          python tools/test-bitrate-diagnostic.py -q
          python tools/test-bitrate-compat.py -q
          python tools/test-bitrate-helper.py -q
          python tools/test-dab-artwork-layout.py -q
          python tools/test-radio-lyrics.py -q
          python tools/test-spinner-online.py -q
          python tools/test-spinner-choice.py -q
          python tools/test-numberzap-picon.py -q
          python tools/test-menu-icon-preview.py -q
          python tools/test-startup-update.py -q
          python tools/test-runtime-safety.py
          python tools/test-release-bytecode.py
      - name: Prepare new version and verify every packaged file
        run: |
          python tools/prepare-openatv81-candidate.py
          python tools/build-setup-style-test.py
          python tools/verify-setup-style-ipk.py
          python tools/verify-spinner-choice-ipk.py
      - uses: actions/upload-artifact@v4
        with:
          name: FullHDGlass-1.0.58-test1
          path: packages/test/*
          retention-days: 30
      - name: Publish immutable IPK without advancing existing update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE=packages/test/enigma2-plugin-skins-fullhdglass_1.0.58-test1_all.ipk
          TAG=v1.0.58-test1
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/immutable
            gh release download "$TAG" --pattern "$(basename "$PACKAGE")" --dir /tmp/immutable
            cmp "$PACKAGE" "/tmp/immutable/$(basename "$PACKAGE")"
          else
            gh release create "$TAG" "$PACKAGE" "$PACKAGE.sha256" --target "$GITHUB_SHA" --prerelease --latest=false --title 'FullHDGlass 1.0.58-test1' --notes-file docs/LCD4LINUX-FOOTER-1.0.58-test1.md
          fi
