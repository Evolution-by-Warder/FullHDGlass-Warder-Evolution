name: Italian provider original vector source review
on:
  push:
    branches: [work/italia-vector-provider-review-20261124]
    paths: ['.github/workflows/italia-vector-provider-review.yml', 'reports/italia-vector-provider-review-20261124/build.py']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reports/italia-vector-provider-review-20261124/
      - run: python -m pip install --quiet Pillow cairosvg
      - run: python reports/italia-vector-provider-review-20261124/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: italian-vector-provider-review
          path: vector-review/
