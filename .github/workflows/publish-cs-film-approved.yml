name: Publish approved CS Film picons without IPK
on:
  push:
    branches: [picons/cs-film-20261022]
    paths: [.github/workflows/publish-cs-film-approved.yml, tools/publish-cs-film-approved.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/picons/cs-film-20261022'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /update.json
            /update-test.json
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
            /assets/warder/downloads/picons/channels/test-candidate/manifest.json
            /assets/warder/downloads/picons/channels/test-candidate/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: f39316527f1b3aa792bd6ffd734acbbd51a2a989
          path: .approved-picons
          sparse-checkout: |
            picons/23.5e/canal-plus-sk
            picons/23.5e/canal-plus-cz
            picons/23.5e/skylink
            picons/23.5e/m7-group
            migration/cs-film-approved-20261022
      - name: Publish approved CS Film artwork and verify archives
        run: |
          python3 tools/publish-cs-film-approved.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/cs-film-approved-20261022.json
          git commit -m 'Replace CS Film picons in Canal+ SK/CZ and 23.5E; preserve IPK 1.0.13'
          git push origin HEAD:refs/heads/picons/cs-film-20261022
      - uses: actions/upload-artifact@v4
        with:
          name: cs-film-data-only-verification
          path: reports/cs-film-approved-20261022.json
