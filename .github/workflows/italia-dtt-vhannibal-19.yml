name: Build all 171 verified DTT Italy variants from official reference evidence
on:
  push:
    branches: [work/italia-dtt-vhannibal-19-20261124]
    paths: ['.github/workflows/italia-dtt-vhannibal-19.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/italia-dtt-vhannibal-19-20261124/*
      - run: python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0
      - run: python reports/italia-dtt-vhannibal-19-20261124/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse assets/warder/downloads/picons/channels reports/italia-dtt-vhannibal-19-20261124/build.json
          git commit -m "Build 171 variants for 19 exact Italian terrestrial references"
          git push origin HEAD:work/italia-dtt-vhannibal-19-20261124
