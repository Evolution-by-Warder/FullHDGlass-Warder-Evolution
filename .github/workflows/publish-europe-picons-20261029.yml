name: Publish approved European picons 29 October
on:
  push:
    branches: [release/europe-picons-20261029]
    paths:
      - .github/workflows/publish-europe-picons-20261029.yml
      - tools/publish-europe-picons-20261029.py
      - tools/test-europe-picons-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: warder-europe-picons-20261029
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/release/europe-picons-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APPROVED_PICON_REF: 5ca5b5a08c0cf2cc7720334d05f00f09db899b8c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/publish-europe-picons-20261029.py
            /tools/test-europe-picons-20261029.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
            /assets/warder/downloads/picons/channels/manifest.json
            /assets/warder/downloads/picons/channels/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/PiconHub-Warder-Evolution
          ref: ${{ env.APPROVED_PICON_REF }}
          path: .approved-source
          sparse-checkout: plugin/artwork/provenance/europe-approved-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Test alias scope, exact PNG preservation and deterministic resizing
        run: python tools/test-europe-picons-20261029.py -v
      - name: Build verified archives and exercise actual receiver installer
        run: python -u tools/publish-europe-picons-20261029.py --source-root .approved-source --source-ref "$APPROVED_PICON_REF"
      - name: Commit content-addressed archives and catalogue together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          git add --sparse assets/warder/downloads/picons/channels reports/europe-picons-publication-20261029.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith('assets/warder/downloads/picons/channels/') or p=='reports/europe-picons-publication-20261029.json' for p in paths),paths
          PY
          git commit -m 'Publish verified owner-approved European picon archives and catalogue'
          git push origin HEAD:release/europe-picons-20261029
      - name: Read back every new public part and verify size and SHA256
        run: python -u tools/publish-europe-picons-20261029.py --verify-public release/europe-picons-20261029
      - name: Record public verification
        shell: bash
        run: |
          set -euo pipefail
          git add reports/europe-picons-publication-20261029.json
          git commit -m 'Record successful public SHA256 verification of European picon parts'
          git push origin HEAD:release/europe-picons-20261029
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-picons-publication-verification-20261029
          path: reports/europe-picons-publication-20261029.json
          if-no-files-found: warn
