name: Release supported-position cleanup 1.0.15
on:
  push:
    branches: [release/position-cleanup-1.0.15]
permissions:
  contents: write
jobs:
  release:
    if: contains(github.event.head_commit.message, 'Build position cleanup 1.0.15')
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/
            /tools/
            /README.md
            /update.json
            /update-test.json
            /assets/warder/picon-satlist-mapping.tsv
            /assets/warder/downloads/picons/channels/manifest.json
      - name: Test real menu rows, supported routes and rejected retired selectors
        run: python3 tools/test-position-cleanup.py
      - name: Verify bytecode upgrade handling
        run: python3 tools/test-release-bytecode.py
      - name: Build installable IPK and both update feeds
        run: |
          python3 tools/build-release-ipk.py
          python3 tools/finalize-position-cleanup-release.py
          python3 tools/verify-radio-release.py
      - name: Store verified release
        run: |
          git config user.name 'Warder release automation'
          git config user.email 'warder-release@users.noreply.github.com'
          git add --sparse -f packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.15_all.ipk packages/enigma2-skin-fullhdglass17-warder-evolution_1.0.15_all.ipk.sha256
          git add --sparse README.md update.json update-test.json reports/position-cleanup-1.0.15.json
          git diff --cached --check
          git commit -m 'Publish verified 1.0.15 IPK and auto-update feeds for supported positions'
          git push origin HEAD:release/position-cleanup-1.0.15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-cleanup-1.0.15
          path: |
            packages/*1.0.15*
            reports/position-cleanup-1.0.15.json
